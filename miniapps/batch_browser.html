<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Voice Ledger &ndash; Batches</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="/miniapps/shared/theme.css">
  <script src="/miniapps/shared/auth.js"></script>
  <style>
    body{padding:0 0 80px;background:var(--bg)}
    .page-header{padding:20px 16px 14px;background:white;border-bottom:1px solid var(--border)}
    .page-header h1{font-size:20px;font-weight:700;color:var(--stone-800);margin-bottom:10px}
    .filter-row{display:flex;gap:8px;padding:12px 16px;background:var(--stone-50);border-bottom:1px solid var(--border)}
    .search-wrap{flex:1;position:relative}
    .search-wrap input{
      width:100%;padding:9px 12px 9px 34px;border:1px solid var(--border);
      border-radius:var(--r-md);font-size:13px;background:white;outline:none;
    }
    .search-wrap input:focus{border-color:var(--stone-800)}
    .search-wrap svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--stone-400)}
    .filter-btn{
      padding:9px 14px;border:1px solid var(--border);border-radius:var(--r-md);
      background:white;font-size:12px;font-weight:600;color:var(--stone-600);
      cursor:pointer;display:flex;align-items:center;gap:4px;white-space:nowrap;
    }
    .filter-btn.active{background:var(--stone-800);color:white;border-color:var(--stone-800)}
    .filter-chips{display:none;flex-wrap:wrap;gap:6px;padding:8px 16px 12px;background:var(--stone-50);border-bottom:1px solid var(--border)}
    .filter-chips.show{display:flex}
    .chip{
      padding:6px 12px;border-radius:99px;border:1px solid var(--border);
      background:white;font-size:12px;color:var(--stone-600);cursor:pointer;transition:all .15s;
    }
    .chip.active{background:var(--stone-800);color:white;border-color:var(--stone-800)}
    .stats-row{display:flex;gap:8px;padding:12px 16px;overflow-x:auto}
    .mini-stat{
      flex:0 0 auto;padding:8px 14px;background:white;
      border:1px solid var(--border);border-radius:var(--r-md);text-align:center;min-width:80px;
    }
    .mini-stat .val{font-size:18px;font-weight:700;color:var(--stone-800)}
    .mini-stat .lbl{font-size:10px;color:var(--stone-400);text-transform:uppercase;letter-spacing:.04em}
    .batch-list{padding:0 16px}
    .batch-card{
      background:white;border:1px solid var(--border);border-radius:var(--r-lg);
      padding:14px;margin-bottom:10px;cursor:pointer;transition:all .15s;
    }
    .batch-card:active{transform:scale(.99);background:var(--stone-50)}
    .batch-row{display:flex;justify-content:space-between;align-items:center}
    .batch-id{font-size:14px;font-weight:700;color:var(--stone-800)}
    .batch-origin{font-size:12px;color:var(--stone-400);margin-top:2px}
    .batch-meta{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
    .batch-tag{font-size:11px;padding:3px 8px;border-radius:99px;font-weight:500}
    .tag-grade{background:var(--stone-100);color:var(--stone-600)}
    .tag-weight{background:var(--stone-100);color:var(--stone-600)}
    .tag-status{font-weight:600}
    .status-harvested{background:#dcfce7;color:#166534}
    .status-processed,.status-processing{background:#dbeafe;color:#1e40af}
    .status-exported,.status-export{background:#fef3c7;color:#92400e}
    .status-received,.status-shipped{background:#e0e7ff;color:#3730a3}
    .status-delivered{background:#dcfce7;color:#166534}
    .detail-overlay{position:fixed;inset:0;background:var(--bg);z-index:200;overflow-y:auto;padding:0 0 40px;display:none}
    .detail-overlay.show{display:block}
    .detail-header{display:flex;align-items:center;gap:12px;padding:16px;background:white;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:1}
    .detail-header .back-btn{width:32px;height:32px;border-radius:50%;border:1px solid var(--border);background:white;display:flex;align-items:center;justify-content:center;cursor:pointer}
    .detail-header .back-btn svg{width:18px;height:18px;color:var(--stone-600)}
    .detail-header h2{font-size:18px;font-weight:700;color:var(--stone-800)}
    .detail-body{padding:16px}
    .detail-section{background:white;border:1px solid var(--border);border-radius:var(--r-lg);padding:16px;margin-bottom:12px}
    .detail-section h3{font-size:12px;font-weight:700;color:var(--stone-400);text-transform:uppercase;letter-spacing:.06em;margin-bottom:12px}
    .empty-state{text-align:center;padding:48px 16px;color:var(--stone-400)}
    .empty-state svg{width:48px;height:48px;margin-bottom:12px;color:var(--stone-300)}
    .loading-state{text-align:center;padding:48px;color:var(--stone-400)}
    .info-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--stone-100)}
    .info-row:last-child{border-bottom:none}
    .info-label{font-size:13px;color:var(--stone-400)}
    .info-value{font-size:13px;font-weight:600;color:var(--stone-800)}
  </style>
</head>
<body>
  <div class="page-header">
    <div style="display:flex;justify-content:space-between;align-items:center">
      <h1 data-i18n="batch_title">Coffee Batches</h1>
      <div class="vl-lang-toggle"><button data-lang="en">EN</button><button data-lang="am">&#4771;&#4635;</button></div>
    </div>
  </div>
  <div class="filter-row">
    <div class="search-wrap">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"></line><line x1="8" y1="11" x2="14" y2="11"></line></svg>
      <input type="text" id="searchInput" placeholder="Search batches...">
    </div>
    <button class="filter-btn" id="filterToggle" aria-label="Filter batches">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="4" y1="21" x2="4" y2="14"></line><line x1="4" y1="10" x2="4" y2="3"></line><line x1="12" y1="21" x2="12" y2="12"></line><line x1="12" y1="8" x2="12" y2="3"></line><line x1="20" y1="21" x2="20" y2="16"></line><line x1="20" y1="12" x2="20" y2="3"></line><line x1="1" y1="14" x2="7" y2="14"></line><line x1="9" y1="8" x2="15" y2="8"></line><line x1="17" y1="16" x2="23" y2="16"></line></svg>
      <span data-i18n="batch_all">Filter</span>
    </button>
  </div>
  <div class="filter-chips" id="filterChips">
    <div class="chip active" data-status="all" data-i18n="batch_all">All</div>
    <div class="chip" data-status="harvested">Harvested</div>
    <div class="chip" data-status="processed" data-i18n="batch_processed">Processed</div>
    <div class="chip" data-status="exported">Exported</div>
    <div class="chip" data-status="shipped" data-i18n="batch_shipped">Shipped</div>
  </div>
  <div class="stats-row" id="statsRow"></div>
  <div class="batch-list" id="batchList"><div class="loading-state" data-i18n="loading">Loading...</div></div>
  <div class="detail-overlay" id="detailOverlay">
    <div class="detail-header">
      <button class="back-btn" id="detailBack" aria-label="Go back to batch list"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15 18 9 12 15 6"></polyline></svg></button>
      <h2 id="detailTitle">Batch Details</h2>
    </div>
    <div class="detail-body" id="detailBody"></div>
  </div>

  <script src="/miniapps/shared/i18n.js"></script>
  <script src="/miniapps/shared/tab-bar.js"></script>
  <script>
    const tg = window.Telegram.WebApp;
    tg.expand(); tg.ready();
    tg.BackButton.show();
    tg.BackButton.onClick(() => { window.location.href = '/miniapps/index.html'; });
    const user = tg.initDataUnsafe.user;
    if (user && user.language_code === 'am' && !localStorage.getItem('vl_lang')) vlI18n.setLang('am');

    // Role-based access check
    (async () => {
      const hasAccess = await checkUserRole('farmer');
      if (!hasAccess) {
        window.location.href = '/miniapps/index.html';
        return;
      }
    })();

    let allBatches = [];
    let activeFilter = 'all';

    async function loadBatches() {
      try {
        const res = await fetch('/api/miniapp/batches?user_id=' + (user?.id || 0), { headers: { 'X-Telegram-User-Id': String(user?.id || 0) } });
        if (!res.ok) throw new Error('Server ' + res.status);
        const data = await res.json();
        allBatches = data.batches || data || [];
        renderStats();
        renderList();
      } catch (e) {
        console.error('Load error:', e);
        document.getElementById('batchList').innerHTML = '<div class="empty-state">' + vlI18n.t('error') + '</div>';
      }
    }

    function renderStats() {
      const total = allBatches.length;
      const harvested = allBatches.filter(b => norm(b) === 'harvested').length;
      const processed = allBatches.filter(b => ['processed','processing'].includes(norm(b))).length;
      const exported  = allBatches.filter(b => ['exported','export','shipped'].includes(norm(b))).length;
      document.getElementById('statsRow').innerHTML =
        mini(total, 'Total') + mini(harvested, 'Harvested') + mini(processed, 'Processed') + mini(exported, 'Exported');
    }
    function mini(v, l) { return '<div class="mini-stat"><div class="val">' + v + '</div><div class="lbl">' + l + '</div></div>'; }
    function norm(b) { return (b.display_status || b.status || '').toLowerCase().replace(/[^a-z]/g, ''); }

    function renderList() {
      const q = document.getElementById('searchInput').value.toLowerCase();
      let list = allBatches;
      if (activeFilter !== 'all') list = list.filter(b => norm(b).includes(activeFilter));
      if (q) list = list.filter(b => (b.batch_id||'').toLowerCase().includes(q) || (b.origin||'').toLowerCase().includes(q) || (b.producer||'').toLowerCase().includes(q));
      if (!list.length) {
        document.getElementById('batchList').innerHTML = '<div class="empty-state">' + vlI18n.t('batch_empty') + '</div>';
        return;
      }
      document.getElementById('batchList').innerHTML = list.map(b => {
        const st = norm(b);
        return '<div class="batch-card" onclick="showDetail(\'' + (b.batch_id||b.id) + '\')">' +
          '<div class="batch-row"><div class="batch-id">' + (b.batch_id||b.id||'') + '</div>' +
          '<span class="batch-tag tag-status status-' + st + '">' + (b.display_status||b.status||'') + '</span></div>' +
          '<div class="batch-origin">' + (b.origin||b.producer||'') + '</div>' +
          '<div class="batch-meta">' +
          (b.quality_grade ? '<span class="batch-tag tag-grade">' + b.quality_grade + '</span>' : '') +
          (b.quantity_kg ? '<span class="batch-tag tag-weight">' + b.quantity_kg + ' kg</span>' : '') +
          '</div></div>';
      }).join('');
    }

    async function showDetail(id) {
      const overlay = document.getElementById('detailOverlay');
      document.getElementById('detailTitle').textContent = id;
      document.getElementById('detailBody').innerHTML = '<div class="loading-state">Loading...</div>';
      overlay.classList.add('show');
      try {
        const res = await fetch('/api/miniapp/batch/' + encodeURIComponent(id) + '?user_id=' + (user?.id || 0), { headers: { 'X-Telegram-User-Id': String(user?.id || 0) } });
        if (!res.ok) throw new Error('Server ' + res.status);
        const b = await res.json();
        
        // Handle nested structure from API
        const batchData = b.batch || b;
        
        let html = '<div class="detail-section"><h3>' + vlI18n.t('batch_info') + '</h3>';
        html += infoRow('Batch ID', batchData.batch_id);
        html += infoRow(vlI18n.t('batch_status'), batchData.display_status);
        html += infoRow(vlI18n.t('batch_origin'), batchData.origin || '');
        html += infoRow(vlI18n.t('batch_grade'), batchData.quality_grade || '');
        html += infoRow(vlI18n.t('batch_quantity'), batchData.quantity_kg ? batchData.quantity_kg + ' kg' : '');
        html += infoRow(vlI18n.t('batch_variety'), batchData.variety || '');
        html += '</div>';   
        if (b.events && b.events.length) {
          html += '<div class="detail-section"><h3>' + vlI18n.t('batch_timeline') + '</h3>';
          b.events.forEach(ev => {
            html += '<div style="padding:8px 0;border-bottom:1px solid var(--stone-100)"><div style="font-weight:600;font-size:13px;color:var(--stone-800)">' + (ev.event_type||ev.type||'') + '</div></div>';
          });
          html += '</div>';
        }
        if (b.blockchain_hash || (b.blockchain && b.blockchain.transaction_hash)) {
          html += '<div class="detail-section"><h3>Blockchain</h3>';
          html += infoRow('Tx Hash', '<span class="mono" style="font-size:11px;word-break:break-all">' + (b.blockchain_hash || b.blockchain.transaction_hash || '') + '</span>');
          html += '</div>';
        }
        document.getElementById('detailBody').innerHTML = html;
      } catch (e) {
        document.getElementById('detailBody').innerHTML = '<div class="empty-state">Failed to load batch details</div>';
      }
    }

    function infoRow(l, v) { return '<div class="info-row"><div class="info-label">' + l + '</div><div class="info-value">' + (v||'&mdash;') + '</div></div>'; }

    document.getElementById('detailBack').addEventListener('click', () => { document.getElementById('detailOverlay').classList.remove('show'); });
    document.getElementById('filterToggle').addEventListener('click', () => {
      document.getElementById('filterChips').classList.toggle('show');
      document.getElementById('filterToggle').classList.toggle('active');
    });
    document.querySelectorAll('.chip').forEach(chip => {
      chip.addEventListener('click', () => {
        document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
        chip.classList.add('active');
        activeFilter = chip.dataset.status;
        renderList();
      });
    });
    document.getElementById('searchInput').addEventListener('input', renderList);

    vlTabBar('batches');
    loadBatches();
  </script>
</body>
</html>
