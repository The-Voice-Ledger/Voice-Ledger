<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Voice Ledger &ndash; Assistant</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="/miniapps/shared/theme.css">
  <style>
    html,body{height:100%;overflow:hidden}
    body{padding:0 0 56px;display:flex;flex-direction:column;background:var(--bg)}

    .chat-header{
      display:flex;align-items:center;gap:12px;
      padding:14px 16px;background:white;border-bottom:1px solid var(--border);flex-shrink:0;
    }
    .chat-header-avatar{
      width:36px;height:36px;border-radius:50%;overflow:hidden;
      display:flex;align-items:center;justify-content:center;
    }
    .chat-header-avatar img{width:100%;height:100%;object-fit:contain}
    .chat-header-info h2{font-size:16px;font-weight:700;color:var(--stone-800);margin:0}
    .chat-header-info p{font-size:11px;color:var(--stone-400);margin:0}

    .messages{
      flex:1;overflow-y:auto;padding:16px 12px;
      display:flex;flex-direction:column;gap:10px;scroll-behavior:smooth;
    }

    .empty-state{
      flex:1;display:flex;flex-direction:column;
      align-items:center;justify-content:center;
      text-align:center;padding:24px;gap:16px;
    }
    .empty-icon{
      position:relative;
      width:96px;height:96px;border-radius:50%;
      background:linear-gradient(135deg,var(--stone-100),var(--stone-50));
      display:flex;align-items:center;justify-content:center;
    }
    .empty-icon img{width:48px;height:48px;object-fit:contain;opacity:.75}
    .empty-icon::after{
      content:'';position:absolute;inset:0;border-radius:50%;
      border:2px solid var(--stone-300);opacity:.3;
      animation:pulse-ring 1.2s cubic-bezier(.215,.61,.355,1) infinite;
    }
    @keyframes pulse-ring{0%{opacity:1;transform:scale(.8)}to{opacity:0;transform:scale(1.4)}}
    .empty-state h3{font-size:18px;font-weight:700;color:var(--stone-800);margin:0}
    .empty-state p{font-size:13px;color:var(--stone-400);margin:0;max-width:260px;line-height:1.5}

    .prompt-grid{
      display:grid;grid-template-columns:1fr 1fr;gap:8px;width:100%;max-width:320px;
    }
    .prompt-pill{
      padding:10px 12px;border-radius:12px;
      background:white;border:1px solid var(--border);
      font-size:12px;color:var(--stone-600);text-align:left;
      cursor:pointer;transition:all .15s;line-height:1.4;
    }
    .prompt-pill:active{background:var(--stone-50);transform:scale(.97)}

    .msg{display:flex;gap:8px;max-width:88%;animation:fadeUp .2s ease}
    .msg.user{align-self:flex-end;flex-direction:row-reverse}
    .msg-avatar{
      width:28px;height:28px;border-radius:50%;flex-shrink:0;
      display:flex;align-items:center;justify-content:center;
      font-size:12px;font-weight:600;color:white;overflow:hidden;
    }
    .msg.assistant .msg-avatar{background:transparent}
    .msg.assistant .msg-avatar img{width:100%;height:100%;object-fit:contain}
    .msg.user .msg-avatar{background:var(--stone-500)}
    .msg-body{
      padding:10px 14px;border-radius:16px;
      font-size:14px;line-height:1.5;word-break:break-word;
    }
    .msg.assistant .msg-body{
      background:white;color:var(--stone-800);
      border:1px solid var(--border);border-bottom-left-radius:4px;
    }
    .msg.user .msg-body{
      background:var(--stone-800);color:white;border-bottom-right-radius:4px;
    }
    .msg-time{font-size:10px;color:var(--stone-400);margin-top:4px;padding:0 4px}
    .msg.user .msg-time{text-align:right}

    .typing-dots{display:inline-flex;gap:4px;padding:4px 0}
    .typing-dots span{
      width:6px;height:6px;border-radius:50%;background:var(--stone-400);
      animation:bounce 1.2s infinite;
    }
    .typing-dots span:nth-child(2){animation-delay:.2s}
    .typing-dots span:nth-child(3){animation-delay:.4s}

    .tool-pills{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
    .tool-pill{
      font-size:10px;padding:2px 8px;border-radius:99px;
      display:inline-flex;align-items:center;gap:3px;
    }
    .tool-pill.ok{background:#dcfce7;color:#166534}
    .tool-pill.err{background:#fee2e2;color:#991b1b}

    .tts-btn{
      display:inline-flex;align-items:center;gap:4px;
      margin-top:6px;padding:3px 10px;border-radius:99px;
      border:1px solid var(--border);background:var(--stone-50);
      color:var(--stone-500);font-size:10px;cursor:pointer;
      transition:all .15s;
    }
    .tts-btn:active{background:var(--stone-100)}
    .tts-btn svg{width:12px;height:12px}

    .input-bar{
      display:flex;align-items:flex-end;gap:8px;
      padding:10px 12px;background:white;
      border-top:1px solid var(--border);flex-shrink:0;
      z-index:100;
    }
    .input-bar textarea{
      flex:1;resize:none;border:1px solid var(--border);
      border-radius:20px;padding:10px 16px;
      font-size:14px;font-family:inherit;
      max-height:100px;line-height:1.4;
      outline:none;transition:border-color .2s;background:var(--stone-50);
    }
    .input-bar textarea:focus{border-color:var(--stone-800)}
    .input-bar textarea::placeholder{color:var(--stone-400)}

    .btn-circle{
      width:42px;height:42px;border-radius:50%;border:none;cursor:pointer;
      flex-shrink:0;display:flex;align-items:center;justify-content:center;
      transition:all .15s;
    }
    .btn-circle:active{transform:scale(.92)}
    .btn-circle svg{width:20px;height:20px}

    .btn-send{background:var(--stone-800);color:white}
    .btn-send:disabled{opacity:.35;cursor:default}

    .btn-mic{background:var(--stone-100);color:var(--stone-600)}
    .btn-mic.recording{background:#fef2f2;color:#ef4444;animation:pulse 1.5s infinite}

    .btn-new-chat{
      margin-left:auto;width:32px;height:32px;border-radius:50%;
      border:1px solid var(--border);background:var(--stone-50);
      color:var(--stone-500);cursor:pointer;display:none;
      align-items:center;justify-content:center;flex-shrink:0;
      transition:all .15s;
    }
    .btn-new-chat:active{background:var(--stone-100);transform:scale(.92)}
    .btn-new-chat svg{width:16px;height:16px}
    .btn-new-chat.show{display:flex}

    @keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
    @keyframes bounce{0%,80%,100%{transform:translateY(0)}40%{transform:translateY(-6px)}}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.6}}
  </style>
</head>
<body>

  <div class="chat-header">
    <div class="chat-header-avatar"><img src="https://violet-rainy-toad-577.mypinata.cloud/ipfs/bafybeic6pclaqgbaaz6qqvlz2ssjgbzae4y7e76d2pobbwfxs2cviwgyqa" alt="WAGA"></div>
    <div class="chat-header-info">
      <h2 data-i18n="assistant_title">Voice Ledger Assistant</h2>
      <p data-i18n="assistant_subtitle">Ask anything about your coffee supply chain</p>
    </div>
    <button class="btn-new-chat" id="newChatBtn" title="New chat">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 1 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/>
      </svg>
    </button>
    <div class="vl-lang-toggle">
      <button data-lang="en">EN</button>
      <button data-lang="am">&#4771;&#4635;</button>
    </div>
  </div>

  <div class="messages" id="messages">
    <div class="empty-state" id="emptyState">
      <div class="empty-icon"><img src="https://violet-rainy-toad-577.mypinata.cloud/ipfs/bafybeic6pclaqgbaaz6qqvlz2ssjgbzae4y7e76d2pobbwfxs2cviwgyqa" alt="WAGA Coffee"></div>
      <h3 data-i18n="assistant_empty_title">How can I help?</h3>
      <p data-i18n="assistant_empty_desc">Ask about batches, RFQs, traceability, compliance, or anything else.</p>
      <div class="prompt-grid" id="promptGrid">
        <div class="prompt-pill" data-prompt="Show my batches" data-i18n="assistant_prompt_1">Show my batches</div>
        <div class="prompt-pill" data-prompt="What containers are available?" data-i18n="assistant_prompt_2">Available containers</div>
        <div class="prompt-pill" data-prompt="Check EUDR compliance for my last batch" data-i18n="assistant_prompt_3">EUDR compliance</div>
        <div class="prompt-pill" data-prompt="Trace lineage for batch ETH-001" data-i18n="assistant_prompt_4">Trace a batch</div>
      </div>
    </div>
  </div>

  <div class="input-bar">
    <button class="btn-circle btn-mic" id="micBtn" title="Voice input">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
        <path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/>
        <line x1="8" y1="23" x2="16" y2="23"/>
      </svg>
    </button>
    <textarea id="chatInput" rows="1" placeholder="Type a message..." data-i18n="assistant_placeholder"></textarea>
    <button class="btn-circle btn-send" id="sendBtn" disabled title="Send">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="22" y1="2" x2="11" y2="13"/>
        <polygon points="22 2 15 22 11 13 2 9 22 2"/>
      </svg>
    </button>
  </div>

  <script src="/miniapps/shared/voice/assistant-livekit-voice.js"></script>
  <script src="/miniapps/shared/i18n.js"></script>
  <script src="/miniapps/shared/tab-bar.js"></script>
<script>
    const tg = window.Telegram.WebApp;
    tg.expand();
    tg.BackButton.show();
    tg.BackButton.onClick(() => { window.location.href = '/miniapps/index.html'; });

    const user = tg.initDataUnsafe.user;
    if (user && user.language_code === 'am' && !localStorage.getItem('vl_lang')) {
      vlI18n.setLang('am');
    }

    const messagesEl = document.getElementById('messages');
    const emptyState = document.getElementById('emptyState');
    const chatInput  = document.getElementById('chatInput');
    const sendBtn    = document.getElementById('sendBtn');
    const micBtn     = document.getElementById('micBtn');
    let messages = [];
    let isLoading = false;
    let conversationId = null;
    let mediaRecorder = null;
    let audioChunks = [];
    let isRecording = false;

    function getUserId() { return tg.initDataUnsafe.user?.id || 0; }
    function getUserInitial() {
      const u = tg.initDataUnsafe.user;
      return u?.first_name ? u.first_name.charAt(0).toUpperCase() : 'U';
    }
    function timeStr() {
      return new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }
    function getLang() { return (window.vlI18n && vlI18n.getLang()) || 'en'; }

    function render() {
      const hasMessages = messages.length > 0;
      document.getElementById('newChatBtn').classList.toggle('show', hasMessages);
      if (!hasMessages) { emptyState.style.display = 'flex'; return; }
      emptyState.style.display = 'none';
      let html = '';
      for (const m of messages) {
        const isUser = m.role === 'user';
        const initial = isUser ? getUserInitial() : '<img src="https://violet-rainy-toad-577.mypinata.cloud/ipfs/bafybeic6pclaqgbaaz6qqvlz2ssjgbzae4y7e76d2pobbwfxs2cviwgyqa" alt="W" style="width:100%;height:100%;object-fit:contain">';
        let bodyHtml = isUser ? escapeHtml(m.text).replace(/\n/g,'<br>') : renderMarkdown(m.text);
        let toolHtml = '';
        if (m.tools && m.tools.length) {
          toolHtml = '<div class="tool-pills">';
          for (const tc of m.tools) {
            const cls = tc.success ? 'ok' : 'err';
            const icon = tc.success ? '&#10003;' : '&#10007;';
            toolHtml += '<span class="tool-pill ' + cls + '">' + icon + ' ' + tc.tool_name + '</span>';
          }
          toolHtml += '</div>';
        }
        let ttsHtml = '';
        if (!isUser && m.audio_base64) {
          const idx = messages.indexOf(m);
          ttsHtml = '<button class="tts-btn" onclick="replayTTS(' + idx + ')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="5 3 19 12 5 21 5 3"/></svg> Play</button>';
        }
        html += '<div class="msg ' + (isUser ? 'user' : 'assistant') + '">' +
          '<div class="msg-avatar">' + initial + '</div><div>' +
          '<div class="msg-body">' + bodyHtml + toolHtml + ttsHtml + '</div>' +
          '<div class="msg-time">' + (m.time || '') + '</div></div></div>';
      }
      if (isLoading) {
        html += '<div class="msg assistant"><div class="msg-avatar"><img src="https://violet-rainy-toad-577.mypinata.cloud/ipfs/bafybeic6pclaqgbaaz6qqvlz2ssjgbzae4y7e76d2pobbwfxs2cviwgyqa" alt="W" style="width:100%;height:100%;object-fit:contain"></div><div>' +
          '<div class="msg-body"><div class="typing-dots"><span></span><span></span><span></span></div></div></div></div>';
      }
      messagesEl.innerHTML = html;
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function escapeHtml(str) {
      if (!str) return '';
      return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    /** Lightweight markdownâ†’HTML for assistant responses */
    function renderMarkdown(str) {
      if (!str) return '';
      let s = escapeHtml(str);
      // code blocks ```...```
      s = s.replace(/```([\s\S]*?)```/g, '<pre style="background:var(--stone-100);padding:8px 12px;border-radius:8px;overflow-x:auto;font-size:12px;margin:6px 0"><code>$1</code></pre>');
      // inline code
      s = s.replace(/`([^`]+)`/g, '<code style="background:var(--stone-100);padding:1px 5px;border-radius:4px;font-size:12px">$1</code>');
      // bold
      s = s.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
      // italic
      s = s.replace(/\*(.+?)\*/g, '<em>$1</em>');
      // links [text](url)
      s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener" style="color:var(--primary);text-decoration:underline">$1</a>');
      // bullet lists
      s = s.replace(/^[\-\*] (.+)$/gm, '<li style="margin-left:16px;list-style:disc">$1</li>');
      // numbered lists
      s = s.replace(/^\d+\. (.+)$/gm, '<li style="margin-left:16px;list-style:decimal">$1</li>');
      // line breaks
      s = s.replace(/\n/g, '<br>');
      return s;
    }

    function replayTTS(idx) {
      const m = messages[idx];
      if (m && m.audio_base64) playBase64Audio(m.audio_base64);
    }

    async function sendText(text) {
      if (!text.trim() || isLoading) return;
      messages.push({ role: 'user', text: text.trim(), time: timeStr() });
      chatInput.value = '';
      chatInput.style.height = 'auto';
      sendBtn.disabled = true;
      isLoading = true;
      render();
      try {
        const res = await fetch('/api/agent/text', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'X-Telegram-User-Id': String(getUserId()) },
          body: JSON.stringify({
            text: text.trim(),
            language: getLang(),
            conversation_id: conversationId,
            context: { app: 'miniapp_assistant', telegram_user_id: getUserId() },
            voice: true,
          }),
        });
        if (!res.ok) throw new Error('Server error ' + res.status);
        const data = await res.json();
        conversationId = data.conversation_id || conversationId;
        messages.push({
          role: 'assistant',
          text: data.text || vlI18n.t('assistant_error'),
          time: timeStr(),
          tools: data.tools_used || [],
          audio_base64: data.audio_base64 || null,
        });
        if (data.audio_base64) playBase64Audio(data.audio_base64);
      } catch (err) {
        console.error('Send error:', err);
        messages.push({ role: 'assistant', text: vlI18n.t('assistant_error'), time: timeStr() });
      }
      isLoading = false;
      render();
    }

    async function sendVoice(audioBlob) {
      messages.push({ role: 'user', text: vlI18n.t('assistant_voice_msg'), time: timeStr() });
      isLoading = true;
      render();
      try {
        const formData = new FormData();
        formData.append('audio', audioBlob, 'voice.webm');
        formData.append('language', getLang());
        if (conversationId) formData.append('conversation_id', conversationId);
        const res = await fetch('/api/agent/voice', {
          method: 'POST',
          headers: { 'X-Telegram-User-Id': String(getUserId()) },
          body: formData,
        });
        if (!res.ok) throw new Error('Server error ' + res.status);
        const data = await res.json();
        conversationId = data.conversation_id || conversationId;
        if (data.transcript) {
          const last = [...messages].reverse().find(m => m.role === 'user');
          if (last) last.text = data.transcript;
        }
        messages.push({
          role: 'assistant',
          text: data.text || vlI18n.t('assistant_error'),
          time: timeStr(),
          tools: data.tools_used || [],
          audio_base64: data.audio_base64 || null,
        });
        if (data.audio_base64) {
          console.log('Playing TTS audio response...');
          window.AssistantLiveKitVoice?.updateState('speaking');
          playBase64Audio(data.audio_base64);
          // The playBase64Audio function will handle the state transition back to listening
        } else {
          // No audio response, transition directly to listening
          setTimeout(() => {
            if (window.AssistantLiveKitVoice?.isReady()) {
              window.AssistantLiveKitVoice?.updateState('listening');
            }
          }, 500);
        }
      } catch (err) {
        console.error('Voice error:', err);
        messages.push({ role: 'assistant', text: vlI18n.t('assistant_voice_fail'), time: timeStr() });
        window.AssistantLiveKitVoice?.updateState('failed');
      }
      isLoading = false;
      render();
    }

    function playBase64Audio(b64) {
      try {
        console.log('Playing base64 audio...');
        const bytes = atob(b64);
        const arr = new Uint8Array(bytes.length);
        for (let i = 0; i < bytes.length; i++) arr[i] = bytes.charCodeAt(i);
        const blob = new Blob([arr], { type: 'audio/mp3' });
        const url = URL.createObjectURL(blob);
        const audio = new Audio(url);
        
        audio.play().then(() => {
          console.log('TTS audio started playing');
        }).catch(e => {
          console.warn('TTS playback failed:', e);
        });
        
        audio.onended = () => {
          console.log('TTS audio finished');
          URL.revokeObjectURL(url);
          // Let LiveKit agent handle state transition back to listening
        };
        
        audio.onerror = () => {
          console.error('TTS audio error');
          URL.revokeObjectURL(url);
          window.AssistantLiveKitVoice?.updateState('failed');
        };
      } catch (e) { 
        console.warn('TTS playback failed', e);
        window.AssistantLiveKitVoice?.updateState('failed');
      }
    }
    chatInput.addEventListener('input', () => {
      chatInput.style.height = 'auto';
      chatInput.style.height = Math.min(chatInput.scrollHeight, 100) + 'px';
      sendBtn.disabled = !chatInput.value.trim();
    });
    chatInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendText(chatInput.value); }
    });
    sendBtn.addEventListener('click', () => sendText(chatInput.value));

    document.querySelectorAll('.prompt-pill').forEach(pill => {
      pill.addEventListener('click', () => {
        // Use the visible (translated) text so Amharic users send Amharic prompts
        const text = pill.textContent.trim();
        if (text) sendText(text);
      });
    });

    const newChatBtn = document.getElementById('newChatBtn');
    newChatBtn.addEventListener('click', () => {
      messages = [];
      conversationId = null;
      isLoading = false;
      chatInput.value = '';
      sendBtn.disabled = true;
      newChatBtn.classList.remove('show');
      render();
      tg.HapticFeedback?.impactOccurred?.('light');
    });

    vlTabBar('assistant');
    render();
    window.AssistantLiveKitVoice?.init({ tg, micBtn });
  </script>
</body>
</html>
