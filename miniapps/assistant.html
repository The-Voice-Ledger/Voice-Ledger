<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Voice Ledger - Assistant</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="/css/theme.css">
    <style>
        html, body { height: 100%; overflow: hidden; }
        body { padding: 0; display: flex; flex-direction: column; background: #f8fafc; }

        /* ── Header ─────────────────────────────────────── */
        .chat-header {
            display: flex; align-items: center; gap: 12px;
            padding: 14px 16px;
            background: white; border-bottom: 1px solid #e5e7eb;
            flex-shrink: 0;
        }
        .chat-header-avatar {
            width: 36px; height: 36px; border-radius: 50%;
            background: linear-gradient(135deg, var(--primary-blue), #7c3aed);
            display: flex; align-items: center; justify-content: center;
            font-size: 18px; color: white;
        }
        .chat-header-info h2 { font-size: 16px; font-weight: 700; color: var(--primary-blue-dark); margin: 0; }
        .chat-header-info p  { font-size: 11px; color: #94a3b8; margin: 0; }

        /* ── Messages area ──────────────────────────────── */
        .messages {
            flex: 1; overflow-y: auto; padding: 16px 12px;
            display: flex; flex-direction: column; gap: 10px;
            scroll-behavior: smooth;
        }

        /* Empty state */
        .empty-state {
            flex: 1; display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            text-align: center; padding: 24px; gap: 16px;
        }
        .empty-state-icon {
            width: 64px; height: 64px; border-radius: 50%;
            background: linear-gradient(135deg, #dbeafe, #ede9fe);
            display: flex; align-items: center; justify-content: center;
            font-size: 28px;
        }
        .empty-state h3 { font-size: 18px; font-weight: 700; color: var(--primary-blue-dark); margin: 0; }
        .empty-state p  { font-size: 13px; color: #94a3b8; margin: 0; max-width: 260px; line-height: 1.5; }

        .prompt-grid {
            display: grid; grid-template-columns: 1fr 1fr; gap: 8px;
            width: 100%; max-width: 320px;
        }
        .prompt-pill {
            padding: 10px 12px; border-radius: 12px;
            background: white; border: 1px solid #e5e7eb;
            font-size: 12px; color: #475569; text-align: left;
            cursor: pointer; transition: all 0.15s;
            line-height: 1.4;
        }
        .prompt-pill:active { background: #f1f5f9; transform: scale(0.97); }

        /* ── Bubbles ────────────────────────────────────── */
        .msg { display: flex; gap: 8px; max-width: 88%; animation: fadeIn 0.2s ease; }
        .msg.user { align-self: flex-end; flex-direction: row-reverse; }
        .msg-avatar {
            width: 28px; height: 28px; border-radius: 50%; flex-shrink: 0;
            display: flex; align-items: center; justify-content: center;
            font-size: 12px; font-weight: 600; color: white;
        }
        .msg.assistant .msg-avatar { background: linear-gradient(135deg, var(--primary-blue), #7c3aed); }
        .msg.user .msg-avatar { background: #64748b; }
        .msg-body {
            padding: 10px 14px; border-radius: 16px;
            font-size: 14px; line-height: 1.5; word-break: break-word;
        }
        .msg.assistant .msg-body {
            background: white; color: #1e293b;
            border: 1px solid #e5e7eb; border-bottom-left-radius: 4px;
        }
        .msg.user .msg-body {
            background: var(--primary-blue); color: white;
            border-bottom-right-radius: 4px;
        }
        .msg-time { font-size: 10px; color: #94a3b8; margin-top: 4px; padding: 0 4px; }
        .msg.user .msg-time { text-align: right; }

        /* Typing indicator */
        .typing-dots { display: inline-flex; gap: 4px; padding: 4px 0; }
        .typing-dots span {
            width: 6px; height: 6px; border-radius: 50%; background: #94a3b8;
            animation: bounce 1.2s infinite;
        }
        .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
        .typing-dots span:nth-child(3) { animation-delay: 0.4s; }

        /* Tool pills */
        .tool-pills { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
        .tool-pill {
            font-size: 10px; padding: 2px 8px; border-radius: 99px;
            display: inline-flex; align-items: center; gap: 3px;
        }
        .tool-pill.ok  { background: #dcfce7; color: #166534; }
        .tool-pill.err { background: #fee2e2; color: #991b1b; }

        /* ── Input bar ──────────────────────────────────── */
        .input-bar {
            display: flex; align-items: flex-end; gap: 8px;
            padding: 10px 12px; background: white;
            border-top: 1px solid #e5e7eb; flex-shrink: 0;
        }
        .input-bar textarea {
            flex: 1; resize: none; border: 1px solid #e2e8f0;
            border-radius: 20px; padding: 10px 16px;
            font-size: 14px; font-family: inherit;
            max-height: 100px; line-height: 1.4;
            outline: none; transition: border-color 0.2s;
        }
        .input-bar textarea:focus { border-color: var(--primary-blue); }
        .input-bar textarea::placeholder { color: #94a3b8; }

        .btn-circle {
            width: 42px; height: 42px; border-radius: 50%;
            border: none; cursor: pointer; flex-shrink: 0;
            display: flex; align-items: center; justify-content: center;
            transition: all 0.15s;
        }
        .btn-circle:active { transform: scale(0.92); }
        .btn-circle svg { width: 20px; height: 20px; }

        .btn-send {
            background: var(--primary-blue); color: white;
        }
        .btn-send:disabled { opacity: 0.4; cursor: default; }
        .btn-send:not(:disabled):hover { background: var(--primary-blue-dark); }

        .btn-mic {
            background: #f1f5f9; color: #475569;
        }
        .btn-mic:hover { background: #e2e8f0; }
        .btn-mic.recording {
            background: #fef2f2; color: #ef4444;
            animation: pulse 1.5s infinite;
        }

        @keyframes fadeIn  { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
        @keyframes bounce  { 0%,80%,100% { transform: translateY(0); } 40% { transform: translateY(-6px); } }
        @keyframes pulse   { 0%,100% { opacity: 1; } 50% { opacity: 0.6; } }

        /* ── Bottom tab bar ─────────────────────────────── */
        .tab-bar {
            display: flex; justify-content: space-around; align-items: center;
            background: white; border-top: 1px solid #e5e7eb;
            padding: 6px 0 env(safe-area-inset-bottom, 6px); flex-shrink: 0;
        }
        .tab-bar a {
            display: flex; flex-direction: column; align-items: center;
            gap: 2px; text-decoration: none; padding: 4px 12px;
            color: #94a3b8; font-size: 10px; font-weight: 500;
            transition: color 0.15s;
        }
        .tab-bar a.active { color: var(--primary-blue); }
        .tab-bar a svg { width: 22px; height: 22px; }
    </style>
</head>
<body>

    <!-- Header -->
    <div class="chat-header">
        <div class="chat-header-avatar">&#9733;</div>
        <div class="chat-header-info">
            <h2>Voice Ledger Assistant</h2>
            <p>Ask anything about your coffee supply chain</p>
        </div>
    </div>

    <!-- Messages -->
    <div class="messages" id="messages">
        <div class="empty-state" id="emptyState">
            <div class="empty-state-icon">&#9749;</div>
            <h3>How can I help?</h3>
            <p>Ask about batches, RFQs, traceability, compliance, or anything else.</p>
            <div class="prompt-grid" id="promptGrid">
                <div class="prompt-pill" data-prompt="Show my batches">Show my batches</div>
                <div class="prompt-pill" data-prompt="What containers are available?">Available containers</div>
                <div class="prompt-pill" data-prompt="Check EUDR compliance for my last batch">EUDR compliance</div>
                <div class="prompt-pill" data-prompt="Trace lineage for batch ETH-001">Trace a batch</div>
            </div>
        </div>
    </div>

    <!-- Input bar -->
    <div class="input-bar">
        <button class="btn-circle btn-mic" id="micBtn" title="Voice input">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
                <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
                <line x1="12" y1="19" x2="12" y2="23"/>
                <line x1="8" y1="23" x2="16" y2="23"/>
            </svg>
        </button>
        <textarea id="chatInput" rows="1" placeholder="Type a message..."></textarea>
        <button class="btn-circle btn-send" id="sendBtn" disabled title="Send">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="22" y1="2" x2="11" y2="13"/>
                <polygon points="22 2 15 22 11 13 2 9 22 2"/>
            </svg>
        </button>
    </div>

    <!-- Bottom tab bar -->
    <nav class="tab-bar">
        <a href="/miniapps/index.html">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
            Home
        </a>
        <a href="/miniapps/batch_browser.html">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg>
            Batches
        </a>
        <a href="/miniapps/assistant.html" class="active">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
            Assistant
        </a>
        <a href="/miniapps/marketplace.html">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
            Market
        </a>
        <a href="/miniapps/profile.html">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            Profile
        </a>
    </nav>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.ready();
        tg.BackButton.show();
        tg.BackButton.onClick(() => { window.location.href = '/miniapps/index.html'; });

        // ── State ──────────────────────────────────────────
        const messagesEl = document.getElementById('messages');
        const emptyState = document.getElementById('emptyState');
        const chatInput  = document.getElementById('chatInput');
        const sendBtn    = document.getElementById('sendBtn');
        const micBtn     = document.getElementById('micBtn');
        let messages = [];
        let isLoading = false;
        let conversationId = null;

        // ── MediaRecorder for voice ────────────────────────
        let mediaRecorder = null;
        let audioChunks = [];
        let isRecording = false;

        // ── Helpers ────────────────────────────────────────
        function getUserId() { return tg.initDataUnsafe.user?.id || 0; }
        function getUserInitial() {
            const u = tg.initDataUnsafe.user;
            return u?.first_name ? u.first_name.charAt(0).toUpperCase() : 'U';
        }
        function timeStr() {
            return new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        }

        // ── Render ─────────────────────────────────────────
        function render() {
            if (messages.length === 0) {
                emptyState.style.display = 'flex';
                return;
            }
            emptyState.style.display = 'none';

            // Build HTML from messages array
            let html = '';
            for (const m of messages) {
                const isUser = m.role === 'user';
                const avatarBg = isUser ? '' : '';
                const initial  = isUser ? getUserInitial() : '&#9733;';
                const time     = m.time || '';

                let bodyHtml = escapeHtml(m.text);

                // Tool pills
                let toolHtml = '';
                if (m.tools?.length) {
                    toolHtml = '<div class="tool-pills">';
                    for (const tc of m.tools) {
                        const cls = tc.success ? 'ok' : 'err';
                        const icon = tc.success ? '&#10003;' : '&#10007;';
                        toolHtml += `<span class="tool-pill ${cls}">${icon} ${tc.tool_name}</span>`;
                    }
                    toolHtml += '</div>';
                }

                html += `
                    <div class="msg ${isUser ? 'user' : 'assistant'}">
                        <div class="msg-avatar">${initial}</div>
                        <div>
                            <div class="msg-body">${bodyHtml}${toolHtml}</div>
                            <div class="msg-time">${time}</div>
                        </div>
                    </div>`;
            }

            // Typing indicator
            if (isLoading) {
                html += `
                    <div class="msg assistant">
                        <div class="msg-avatar">&#9733;</div>
                        <div>
                            <div class="msg-body">
                                <div class="typing-dots"><span></span><span></span><span></span></div>
                            </div>
                        </div>
                    </div>`;
            }

            messagesEl.innerHTML = html;
            messagesEl.scrollTop = messagesEl.scrollHeight;
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
                      .replace(/\n/g, '<br>');
        }

        // ── Send text ──────────────────────────────────────
        async function sendText(text) {
            if (!text.trim() || isLoading) return;

            // Push user message
            messages.push({ role: 'user', text: text.trim(), time: timeStr() });
            chatInput.value = '';
            chatInput.style.height = 'auto';
            sendBtn.disabled = true;
            isLoading = true;
            render();

            try {
                const res = await fetch('/api/agent/text', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Telegram-User-Id': String(getUserId()),
                    },
                    body: JSON.stringify({
                        text: text.trim(),
                        language: 'en',
                        conversation_id: conversationId,
                        context: { app: 'miniapp_assistant', telegram_user_id: getUserId() },
                        voice: false,
                    }),
                });

                if (!res.ok) throw new Error(`Server error ${res.status}`);
                const data = await res.json();

                conversationId = data.conversation_id || conversationId;
                messages.push({
                    role: 'assistant',
                    text: data.text || 'No response.',
                    time: timeStr(),
                    tools: data.tools_used || [],
                });
            } catch (err) {
                console.error('Send error:', err);
                messages.push({ role: 'assistant', text: 'Sorry, something went wrong. Please try again.', time: timeStr() });
            }

            isLoading = false;
            render();
        }

        // ── Send voice ─────────────────────────────────────
        async function sendVoice(audioBlob) {
            messages.push({ role: 'user', text: '🎤 Voice message', time: timeStr() });
            isLoading = true;
            render();

            try {
                const formData = new FormData();
                formData.append('file', audioBlob, 'voice.webm');
                formData.append('language', 'en');
                if (conversationId) formData.append('conversation_id', conversationId);

                const res = await fetch('/api/agent/voice', {
                    method: 'POST',
                    headers: { 'X-Telegram-User-Id': String(getUserId()) },
                    body: formData,
                });

                if (!res.ok) throw new Error(`Server error ${res.status}`);
                const data = await res.json();

                conversationId = data.conversation_id || conversationId;

                // Update user bubble with transcript
                if (data.transcript) {
                    const last = messages[messages.length - 1];
                    if (last?.role === 'user') last.text = '🎤 ' + data.transcript;
                }

                messages.push({
                    role: 'assistant',
                    text: data.text || 'No response.',
                    time: timeStr(),
                    tools: data.tools_used || [],
                });

                // Play TTS if available
                if (data.audio_base64) {
                    playBase64Audio(data.audio_base64);
                }
            } catch (err) {
                console.error('Voice error:', err);
                messages.push({ role: 'assistant', text: 'Sorry, voice processing failed. Try typing instead.', time: timeStr() });
            }

            isLoading = false;
            render();
        }

        function playBase64Audio(b64) {
            try {
                const bytes = atob(b64);
                const arr = new Uint8Array(bytes.length);
                for (let i = 0; i < bytes.length; i++) arr[i] = bytes.charCodeAt(i);
                const blob = new Blob([arr], { type: 'audio/mp3' });
                const url = URL.createObjectURL(blob);
                const audio = new Audio(url);
                audio.play().catch(() => {});
                audio.onended = () => URL.revokeObjectURL(url);
            } catch (e) { console.warn('TTS playback failed', e); }
        }

        // ── Mic recording ──────────────────────────────────
        async function toggleRecording() {
            if (isRecording) {
                // Stop
                mediaRecorder?.stop();
                return;
            }

            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                audioChunks = [];
                mediaRecorder = new MediaRecorder(stream, { mimeType: 'audio/webm;codecs=opus' });

                mediaRecorder.ondataavailable = (e) => { if (e.data.size > 0) audioChunks.push(e.data); };
                mediaRecorder.onstop = () => {
                    stream.getTracks().forEach(t => t.stop());
                    isRecording = false;
                    micBtn.classList.remove('recording');
                    const blob = new Blob(audioChunks, { type: 'audio/webm' });
                    if (blob.size > 1000) { // Sanity: ignore micro-blobs
                        sendVoice(blob);
                    }
                };

                mediaRecorder.start();
                isRecording = true;
                micBtn.classList.add('recording');
                tg.HapticFeedback?.impactOccurred?.('light');
            } catch (err) {
                console.error('Mic error:', err);
                tg.showAlert('Microphone access denied. Please allow microphone in browser settings.');
            }
        }

        // ── Event wiring ───────────────────────────────────
        chatInput.addEventListener('input', () => {
            chatInput.style.height = 'auto';
            chatInput.style.height = Math.min(chatInput.scrollHeight, 100) + 'px';
            sendBtn.disabled = !chatInput.value.trim();
        });

        chatInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendText(chatInput.value);
            }
        });

        sendBtn.addEventListener('click', () => sendText(chatInput.value));
        micBtn.addEventListener('click', toggleRecording);

        // Prompt pills
        document.querySelectorAll('.prompt-pill').forEach(pill => {
            pill.addEventListener('click', () => {
                const prompt = pill.dataset.prompt;
                if (prompt) sendText(prompt);
            });
        });

        // Initial render
        render();
    </script>
</body>
</html>
