<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Voice Ledger &ndash; Marketplace</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="/miniapps/shared/theme.css">
  <style>
    body{padding:0 0 80px;background:var(--bg)}
    .page-header{
      padding:20px 16px 14px;background:white;border-bottom:1px solid var(--border);
      display:flex;justify-content:space-between;align-items:center;
    }
    .page-header h1{font-size:20px;font-weight:700;color:var(--stone-800)}
    .seg-tabs{display:flex;gap:4px;padding:12px 16px;background:var(--stone-50);border-bottom:1px solid var(--border)}
    .seg-tab{
      flex:1;padding:8px;border-radius:var(--r-md);border:1px solid var(--border);
      background:white;text-align:center;font-size:13px;font-weight:600;
      color:var(--stone-500);cursor:pointer;transition:all .15s;
    }
    .seg-tab.active{background:var(--stone-800);color:white;border-color:var(--stone-800)}
    .card-list{padding:12px 16px}
    .rfq-card{
      background:white;border:1px solid var(--border);border-radius:var(--r-lg);
      padding:14px;margin-bottom:10px;cursor:pointer;transition:all .15s;
    }
    .rfq-card:active{transform:scale(.99);background:var(--stone-50)}
    .rfq-top{display:flex;justify-content:space-between;align-items:flex-start}
    .rfq-title{font-size:14px;font-weight:700;color:var(--stone-800);margin-bottom:2px}
    .rfq-buyer{font-size:12px;color:var(--stone-400)}
    .rfq-meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
    .rfq-tag{padding:3px 8px;border-radius:99px;font-size:11px;font-weight:500;background:var(--stone-100);color:var(--stone-600)}
    .rfq-tag.qty{background:#dbeafe;color:#1e40af}
    .rfq-tag.price{background:#dcfce7;color:#166534}
    .rfq-tag.deadline{background:#fef3c7;color:#92400e}
    .status-open{background:#dcfce7;color:#166534}
    .status-closed{background:var(--stone-100);color:var(--stone-500)}
    .status-awarded{background:#dbeafe;color:#1e40af}
    .detail-overlay{position:fixed;inset:0;background:var(--bg);z-index:200;overflow-y:auto;padding-bottom:40px;display:none}
    .detail-overlay.show{display:block}
    .detail-header{display:flex;align-items:center;gap:12px;padding:16px;background:white;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:1}
    .back-btn{width:32px;height:32px;border-radius:50%;border:1px solid var(--border);background:white;display:flex;align-items:center;justify-content:center;cursor:pointer}
    .back-btn svg{width:18px;height:18px;color:var(--stone-600)}
    .detail-body{padding:16px}
    .detail-section{background:white;border:1px solid var(--border);border-radius:var(--r-lg);padding:16px;margin-bottom:12px}
    .detail-section h3{font-size:12px;font-weight:700;color:var(--stone-400);text-transform:uppercase;letter-spacing:.06em;margin-bottom:12px}
    .info-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--stone-100)}
    .info-row:last-child{border-bottom:none}
    .info-label{font-size:13px;color:var(--stone-400)}
    .info-value{font-size:13px;font-weight:600;color:var(--stone-800)}
    .offer-form{background:white;border:1px solid var(--border);border-radius:var(--r-lg);padding:16px;margin-bottom:12px}
    .offer-form h3{font-size:12px;font-weight:700;color:var(--stone-400);text-transform:uppercase;letter-spacing:.06em;margin-bottom:14px}
    .form-group{margin-bottom:12px}
    .form-group label{display:block;font-size:12px;font-weight:600;color:var(--stone-600);margin-bottom:4px}
    .form-group input,.form-group textarea{
      width:100%;padding:9px 12px;border:1px solid var(--border);
      border-radius:var(--r-md);font-size:13px;background:var(--stone-50);outline:none;font-family:inherit;
    }
    .form-group textarea{resize:vertical;min-height:60px}
    .form-group input:focus,.form-group textarea:focus{border-color:var(--stone-800)}
    .empty-state{text-align:center;padding:48px 16px;color:var(--stone-400);font-size:14px}
    .loading-state{text-align:center;padding:48px;color:var(--stone-400)}
  </style>
</head>
<body>
  <div class="page-header">
    <h1 data-i18n="market_title">Marketplace</h1>
    <div class="vl-lang-toggle"><button data-lang="en">EN</button><button data-lang="am">&#4771;&#4635;</button></div>
  </div>
  <div class="seg-tabs">
    <div class="seg-tab active" data-tab="open" data-i18n="market_open">Open RFQs</div>
    <div class="seg-tab" data-tab="my">My Offers</div>
  </div>
  <div class="card-list" id="cardList"><div class="loading-state" data-i18n="loading">Loading...</div></div>
  <div class="detail-overlay" id="detailOverlay">
    <div class="detail-header">
      <div class="back-btn" id="detailBack"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg></div>
      <h2 id="detailTitle" style="font-size:18px;font-weight:700;color:var(--stone-800)">RFQ Details</h2>
    </div>
    <div class="detail-body" id="detailBody"></div>
  </div>

  <script src="/miniapps/shared/i18n.js"></script>
  <script src="/miniapps/shared/tab-bar.js"></script>
  <script>
    const tg = window.Telegram.WebApp;
    tg.expand(); tg.ready();
    tg.BackButton.show();
    tg.BackButton.onClick(() => { window.location.href = '/miniapps/index.html'; });
    const user = tg.initDataUnsafe.user;
    if (user && user.language_code === 'am' && !localStorage.getItem('vl_lang')) vlI18n.setLang('am');

    let allRfqs = [];
    let myOffers = [];
    let activeTab = 'open';

    document.querySelectorAll('.seg-tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.seg-tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        activeTab = tab.dataset.tab;
        renderList();
      });
    });

    async function loadData() {
      try {
        const [rfqRes, offRes] = await Promise.all([
          fetch('/api/marketplace/rfqs', { headers: { 'X-Telegram-User-Id': user?.id || 0 } }),
          fetch('/api/marketplace/my-offers', { headers: { 'X-Telegram-User-Id': user?.id || 0 } }).catch(() => ({ ok: false })),
        ]);
        if (rfqRes.ok) { const d = await rfqRes.json(); allRfqs = d.rfqs || d || []; }
        if (offRes.ok) { const d = await offRes.json(); myOffers = d.offers || d || []; }
        renderList();
      } catch (e) {
        console.error(e);
        document.getElementById('cardList').innerHTML = '<div class="empty-state">' + vlI18n.t('error') + '</div>';
      }
    }

    function renderList() {
      const el = document.getElementById('cardList');
      if (activeTab === 'my') {
        if (!myOffers.length) { el.innerHTML = '<div class="empty-state">No offers yet</div>'; return; }
        el.innerHTML = myOffers.map(o =>
          '<div class="rfq-card"><div class="rfq-top"><div><div class="rfq-title">' + (o.rfq_title||'Offer #'+o.id) + '</div>' +
          '<div class="rfq-buyer">Your price: $' + (o.price||'') + '/kg</div></div>' +
          '<span class="rfq-tag status-' + (o.status||'open') + '">' + (o.status||'pending') + '</span></div></div>'
        ).join('');
        return;
      }
      if (!allRfqs.length) { el.innerHTML = '<div class="empty-state">' + vlI18n.t('market_empty') + '</div>'; return; }
      el.innerHTML = allRfqs.map(r => {
        const st = (r.status||'open').toLowerCase();
        return '<div class="rfq-card" onclick="showRfqDetail(' + (r.id||0) + ')">' +
          '<div class="rfq-top"><div><div class="rfq-title">' + (r.title||r.coffee_type||'RFQ #'+r.id) + '</div>' +
          '<div class="rfq-buyer">' + (r.buyer_name||r.buyer||'') + '</div></div>' +
          '<span class="rfq-tag status-' + st + '">' + st + '</span></div>' +
          '<div class="rfq-meta">' +
          (r.quantity ? '<span class="rfq-tag qty">' + r.quantity + ' kg</span>' : '') +
          (r.target_price ? '<span class="rfq-tag price">$' + r.target_price + '/kg</span>' : '') +
          (r.deadline ? '<span class="rfq-tag deadline">' + r.deadline + '</span>' : '') +
          '</div></div>';
      }).join('');
    }

    async function showRfqDetail(id) {
      const overlay = document.getElementById('detailOverlay');
      overlay.classList.add('show');
      document.getElementById('detailBody').innerHTML = '<div class="loading-state">Loading...</div>';
      const r = allRfqs.find(x => x.id === id);
      if (!r) { overlay.classList.remove('show'); return; }
      document.getElementById('detailTitle').textContent = r.title || 'RFQ #' + r.id;
      const t = vlI18n.t.bind(vlI18n);
      let html = '<div class="detail-section"><h3>RFQ Details</h3>';
      html += infoRow(t('market_buyer'), r.buyer_name||r.buyer||'');
      html += infoRow('Coffee Type', r.coffee_type||'');
      html += infoRow(t('market_quantity'), r.quantity ? r.quantity+' kg' : '');
      html += infoRow('Target Price', r.target_price ? '$'+r.target_price+'/kg' : '');
      html += infoRow(t('market_deadline'), r.deadline||'');
      html += infoRow('Status', r.status||'');
      if (r.notes||r.description) html += '<div style="margin-top:12px;font-size:13px;color:var(--stone-600);line-height:1.5">' + (r.notes||r.description) + '</div>';
      html += '</div>';
      html += '<div class="offer-form"><h3>' + t('market_submit_offer') + '</h3>' +
        '<div class="form-group"><label>' + t('market_price') + '</label><input type="number" id="offerPrice" step="0.01" placeholder="e.g. 4.50"></div>' +
        '<div class="form-group"><label>' + t('market_quantity') + '</label><input type="number" id="offerQty" placeholder="e.g. 500"></div>' +
        '<div class="form-group"><label>' + t('market_notes') + '</label><textarea id="offerNotes" placeholder="Optional notes..."></textarea></div>' +
        '<button class="vl-btn-primary" style="width:100%" onclick="submitOffer(' + id + ')">' + t('market_submit') + '</button></div>';
      document.getElementById('detailBody').innerHTML = html;
    }

    function infoRow(l,v) { return '<div class="info-row"><div class="info-label">' + l + '</div><div class="info-value">' + (v||'&mdash;') + '</div></div>'; }

    async function submitOffer(rfqId) {
      const price = document.getElementById('offerPrice').value;
      const qty = document.getElementById('offerQty').value;
      const notes = document.getElementById('offerNotes').value;
      if (!price) { tg.showAlert('Price is required'); return; }
      try {
        const res = await fetch('/api/marketplace/offers', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'X-Telegram-User-Id': user?.id || 0 },
          body: JSON.stringify({ rfq_id: rfqId, price: parseFloat(price), quantity: qty ? parseFloat(qty) : null, notes }),
        });
        if (!res.ok) throw new Error('Server ' + res.status);
        tg.showAlert(vlI18n.t('market_success'));
        document.getElementById('detailOverlay').classList.remove('show');
        loadData();
      } catch (e) { console.error(e); tg.showAlert('Failed to submit offer'); }
    }

    document.getElementById('detailBack').addEventListener('click', () => { document.getElementById('detailOverlay').classList.remove('show'); });

    vlTabBar('market');
    loadData();
  </script>
</body>
</html>
