<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Voice Ledger &ndash; Marketplace</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="/miniapps/shared/theme.css">
  <script src="/miniapps/shared/auth.js"></script>
  <style>
    body{padding:0 0 80px;background:var(--bg)}
    .page-header{
      padding:20px 16px 14px;background:white;border-bottom:1px solid var(--border);
      display:flex;justify-content:space-between;align-items:center;
    }
    .page-header h1{font-size:20px;font-weight:700;color:var(--stone-800)}

    /* 3-tab switcher */
    .seg-tabs{display:flex;gap:4px;padding:10px 16px;background:var(--stone-50);border-bottom:1px solid var(--border);overflow-x:auto}
    .seg-tab{
      flex:1;min-width:0;padding:8px 4px;border-radius:var(--r-md);border:1px solid var(--border);
      background:white;text-align:center;font-size:12px;font-weight:600;
      color:var(--stone-500);cursor:pointer;transition:all .15s;white-space:nowrap;
    }
    .seg-tab.active{background:var(--stone-800);color:white;border-color:var(--stone-800)}
    .seg-tab .tab-count{
      display:inline-flex;align-items:center;justify-content:center;
      min-width:18px;height:18px;border-radius:99px;font-size:10px;font-weight:700;
      margin-left:4px;padding:0 4px;
      background:var(--stone-100);color:var(--stone-500);
    }
    .seg-tab.active .tab-count{background:rgba(255,255,255,.2);color:white}

    .card-list{padding:12px 16px}

    /* RFQ cards */
    .rfq-card{
      background:white;border:1px solid var(--border);border-radius:var(--r-lg);
      padding:14px;margin-bottom:10px;cursor:pointer;transition:all .15s;
    }
    .rfq-card:active{transform:scale(.99);background:var(--stone-50)}
    .rfq-top{display:flex;justify-content:space-between;align-items:flex-start}
    .rfq-title{font-size:14px;font-weight:700;color:var(--stone-800);margin-bottom:2px}
    .rfq-buyer{font-size:12px;color:var(--stone-400)}
    .rfq-meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
    .rfq-tag{padding:3px 8px;border-radius:99px;font-size:11px;font-weight:500;background:var(--stone-100);color:var(--stone-600)}
    .rfq-tag.qty{background:#dbeafe;color:#1e40af}
    .rfq-tag.price{background:#dcfce7;color:#166534}
    .rfq-tag.deadline{background:#fef3c7;color:#92400e}
    .status-open{background:#dcfce7;color:#166534}
    .status-closed{background:var(--stone-100);color:var(--stone-500)}
    .status-awarded{background:#dbeafe;color:#1e40af}
    .status-pending{background:#fef3c7;color:#92400e}

    /* Container cards */
    .container-card{
      background:white;border:1px solid var(--border);border-radius:var(--r-lg);
      padding:14px;margin-bottom:10px;cursor:pointer;transition:all .15s;
    }
    .container-card:active{transform:scale(.99);background:var(--stone-50)}
    .container-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px}
    .container-sscc{font-size:11px;font-family:monospace;color:var(--stone-400)}
    .container-variety{font-size:14px;font-weight:700;color:var(--stone-800)}
    .container-details{display:grid;grid-template-columns:1fr 1fr;gap:4px 12px;margin-bottom:10px}
    .container-detail{font-size:12px;color:var(--stone-500)}
    .container-detail strong{color:var(--stone-700)}

    /* Fill bar */
    .fill-bar-wrap{margin-top:8px}
    .fill-bar-header{display:flex;justify-content:space-between;font-size:11px;color:var(--stone-500);margin-bottom:4px}
    .fill-bar-header .pct{font-weight:700;color:var(--stone-700)}
    .fill-bar{height:8px;background:var(--stone-100);border-radius:99px;overflow:hidden}
    .fill-bar-inner{height:100%;border-radius:99px;transition:width .7s ease-out}
    .fill-bar-inner.low{background:#3b82f6}
    .fill-bar-inner.mid{background:#eab308}
    .fill-bar-inner.high{background:#22c55e}

    .buyers-badge{
      display:inline-flex;align-items:center;gap:3px;
      font-size:11px;color:var(--stone-400);margin-top:6px;
    }
    .buyers-badge svg{width:13px;height:13px}

    .regions-row{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}
    .region-chip{font-size:10px;padding:2px 7px;border-radius:99px;background:#ede9fe;color:#6d28d9;font-weight:500}

    /* Status badges */
    .status-badge{padding:3px 8px;border-radius:99px;font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.04em}
    .status-AVAILABLE{background:#dcfce7;color:#166534}
    .status-PARTIALLY_SOLD{background:#fef3c7;color:#92400e}
    .status-FULLY_RESERVED{background:var(--stone-100);color:var(--stone-500)}
    .status-SOLD_OUT{background:var(--stone-100);color:var(--stone-500)}
    .status-EXPIRED{background:#fee2e2;color:#991b1b}

    /* Detail overlay */
    .detail-overlay{position:fixed;inset:0;background:var(--bg);z-index:200;overflow-y:auto;padding-bottom:40px;display:none}
    .detail-overlay.show{display:block}
    .detail-header{display:flex;align-items:center;gap:12px;padding:16px;background:white;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:1}
    .back-btn{width:32px;height:32px;border-radius:50%;border:1px solid var(--border);background:white;display:flex;align-items:center;justify-content:center;cursor:pointer}
    .back-btn svg{width:18px;height:18px;color:var(--stone-600)}
    .detail-body{padding:16px}
    .detail-section{background:white;border:1px solid var(--border);border-radius:var(--r-lg);padding:16px;margin-bottom:12px}
    .detail-section h3{font-size:12px;font-weight:700;color:var(--stone-400);text-transform:uppercase;letter-spacing:.06em;margin-bottom:12px}
    .info-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--stone-100)}
    .info-row:last-child{border-bottom:none}
    .info-label{font-size:13px;color:var(--stone-400)}
    .info-value{font-size:13px;font-weight:600;color:var(--stone-800)}
    .offer-form{background:white;border:1px solid var(--border);border-radius:var(--r-lg);padding:16px;margin-bottom:12px}
    .offer-form h3{font-size:12px;font-weight:700;color:var(--stone-400);text-transform:uppercase;letter-spacing:.06em;margin-bottom:14px}
    .form-group{margin-bottom:12px}
    .form-group label{display:block;font-size:12px;font-weight:600;color:var(--stone-600);margin-bottom:4px}
    .form-group input,.form-group textarea{
      width:100%;padding:9px 12px;border:1px solid var(--border);
      border-radius:var(--r-md);font-size:13px;background:var(--stone-50);outline:none;font-family:inherit;
    }
    .form-group textarea{resize:vertical;min-height:60px}
    .form-group input:focus,.form-group textarea:focus{border-color:var(--stone-800)}
    .empty-state{text-align:center;padding:48px 16px;color:var(--stone-400);font-size:14px;line-height:1.6}
    .loading-state{text-align:center;padding:48px;color:var(--stone-400)}
  </style>
</head>
<body>
  <div class="page-header">
    <h1 data-i18n="market_title">Marketplace</h1>
    <div class="vl-lang-toggle"><button data-lang="en">EN</button><button data-lang="am">&#4771;&#4635;</button></div>
  </div>
  <div class="seg-tabs">
    <div class="seg-tab active" data-tab="rfqs"><span data-i18n="market_tab_rfqs">Open RFQs</span><span class="tab-count" id="rfqCount">0</span></div>
    <div class="seg-tab" data-tab="containers"><span data-i18n="market_tab_containers">My Containers</span><span class="tab-count" id="containerCount">0</span></div>
    <div class="seg-tab" data-tab="offers"><span data-i18n="market_tab_offers">My Offers</span><span class="tab-count" id="offerCount">0</span></div>
  </div>
  <div class="card-list" id="cardList"><div class="loading-state" data-i18n="loading">Loading...</div></div>

  <!-- Detail overlay -->
  <div class="detail-overlay" id="detailOverlay">
    <div class="detail-header">
      <div class="back-btn" id="detailBack"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg></div>
      <h2 id="detailTitle" style="font-size:18px;font-weight:700;color:var(--stone-800)">Details</h2>
    </div>
    <div class="detail-body" id="detailBody"></div>
  </div>

  <script src="/miniapps/shared/i18n.js"></script>
  <script src="/miniapps/shared/tab-bar.js"></script>
  <script>
    const tg = window.Telegram.WebApp;
    tg.expand(); tg.ready();
    tg.BackButton.show();
    tg.BackButton.onClick(() => { window.location.href = '/miniapps/index.html'; });
    const user = tg.initDataUnsafe.user;
    if (user && user.language_code === 'am' && !localStorage.getItem('vl_lang')) vlI18n.setLang('am');

    // Role-based access check
    (async () => {
      const hasAccess = await checkUserRole('marketplace');
      if (!hasAccess) {
        window.location.href = '/miniapps/index.html';
        return;
      }
    })();

    const headers = { 'X-Telegram-User-Id': String(user?.id || 0) };
    let allRfqs = [], myContainers = [], myOffers = [];
    let activeTab = 'rfqs';

    /* ── Tab switching ────────────────────────────────────── */
    document.querySelectorAll('.seg-tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.seg-tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        activeTab = tab.dataset.tab;
        renderList();
      });
    });

    /* ── Data loading ─────────────────────────────────────── */
    async function loadData() {
      try {
        const [rfqRes, contRes, offRes] = await Promise.all([
          fetch('/api/rfqs', { headers }).catch(() => ({ ok: false })),
          fetch('/api/marketplace/my-containers', { headers }).catch(() => ({ ok: false })),
          fetch('/api/marketplace/my-offers', { headers }).catch(() => ({ ok: false })),
        ]);
        if (rfqRes.ok) { const d = await rfqRes.json(); allRfqs = Array.isArray(d) ? d : []; }
        if (contRes.ok) { const d = await contRes.json(); myContainers = d.containers || []; }
        if (offRes.ok) { const d = await offRes.json(); myOffers = d.offers || []; }
        const openRfqsCount = allRfqs.filter(r => r.status === 'OPEN' || r.status === 'PARTIALLY_FILLED').length;
        document.getElementById('rfqCount').textContent = openRfqsCount;
        document.getElementById('containerCount').textContent = myContainers.length;
        document.getElementById('offerCount').textContent = myOffers.length;
        renderList();
      } catch (e) {
        console.error(e);
        document.getElementById('cardList').innerHTML = '<div class="empty-state">' + vlI18n.t('error') + '</div>';
      }
    }

    /* ── Render router ────────────────────────────────────── */
    function renderList() {
      const el = document.getElementById('cardList');
      if (activeTab === 'rfqs') return renderRfqs(el);
      if (activeTab === 'containers') return renderContainers(el);
      if (activeTab === 'offers') return renderOffers(el);
    }

    /* ---------- RFQs ---------- */
    function renderRfqs(el) {
      // Filter to show only RFQs that are still accepting offers
      const openRfqs = allRfqs.filter(r => 
        r.status === 'OPEN' || r.status === 'PARTIALLY_FILLED'
      );
      
      if (!openRfqs.length) { el.innerHTML = '<div class="empty-state">' + vlI18n.t('market_empty') + '</div>'; return; }
      el.innerHTML = openRfqs.map(r => {
        const st = (r.status||'open').toLowerCase();
        return '<div class="rfq-card" onclick="showRfqDetail(' + (r.id||0) + ')">' +
          '<div class="rfq-top"><div><div class="rfq-title">' + esc(r.rfq_number||'RFQ #'+r.id) + '</div>' +
          '<div class="rfq-buyer">' + esc(r.buyer_organization||'') + '</div></div>' +
          '<span class="rfq-tag status-' + st + '">' + st + '</span></div>' +
          '<div class="rfq-meta">' +
          (r.quantity_kg ? '<span class="rfq-tag qty">' + r.quantity_kg + ' kg</span>' : '') +
          (r.variety ? '<span class="rfq-tag">' + esc(r.variety) + '</span>' : '') +
          (r.delivery_deadline ? '<span class="rfq-tag deadline">' + fmtDate(r.delivery_deadline) + '</span>' : '') +
          '</div></div>';
      }).join('');
    }

    /* ---------- My Containers ---------- */
    function renderContainers(el) {
      if (!myContainers.length) {
        el.innerHTML = '<div class="empty-state">' + vlI18n.t('market_no_containers') +
          '<br><span style="font-size:12px;color:var(--stone-400)">' + vlI18n.t('market_no_containers_hint') + '</span></div>';
        return;
      }
      el.innerHTML = myContainers.map(c => {
        const pct = c.fill_percentage || 0;
        const barCls = pct >= 80 ? 'high' : pct >= 50 ? 'mid' : 'low';
        const statusCls = 'status-' + (c.status||'AVAILABLE');
        return '<div class="container-card" onclick="showContainerDetail(' + c.id + ')">' +
          '<div class="container-header"><div>' +
          '<div class="container-sscc">' + esc(c.container_sscc) + '</div>' +
          '<div class="container-variety">' + esc(c.variety || 'Coffee') + (c.grade ? ' &middot; ' + esc(c.grade) : '') + '</div>' +
          '</div><span class="status-badge ' + statusCls + '">' + (c.status||'').replace(/_/g,' ') + '</span></div>' +
          '<div class="container-details">' +
          '<div class="container-detail">' + vlI18n.t('market_price') + ': <strong>$' + c.price_per_kg + '/kg</strong></div>' +
          '<div class="container-detail">' + vlI18n.t('market_total') + ': <strong>' + fmt(c.total_quantity_kg) + ' kg</strong></div>' +
          '<div class="container-detail">' + vlI18n.t('market_sold') + ': <strong>' + fmt(c.sold_quantity_kg||0) + ' kg</strong></div>' +
          '<div class="container-detail">' + vlI18n.t('market_available_qty') + ': <strong>' + fmt(c.available_quantity_kg) + ' kg</strong></div>' +
          '</div>' +
          '<div class="fill-bar-wrap"><div class="fill-bar-header"><span>' + fmt(c.total_quantity_kg - c.available_quantity_kg) + ' / ' + fmt(c.total_quantity_kg) + ' kg</span><span class="pct">' + Math.round(pct) + '%</span></div>' +
          '<div class="fill-bar"><div class="fill-bar-inner ' + barCls + '" style="width:' + Math.min(pct,100) + '%"></div></div></div>' +
          '<div style="display:flex;justify-content:space-between;align-items:center;margin-top:6px">' +
          '<span class="buyers-badge"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>' +
          (c.buyer_count||0) + ' ' + vlI18n.t('market_buyers') + '</span>' +
          (c.pool_count ? '<span class="buyers-badge">' + c.pool_count + ' ' + vlI18n.t('market_pools') + '</span>' : '') +
          '</div>' +
          (c.pool_regions && c.pool_regions.length ? '<div class="regions-row">' + c.pool_regions.map(r => '<span class="region-chip">' + esc(r) + '</span>').join('') + '</div>' : '') +
          '</div>';
      }).join('');
    }

    /* ---------- My Offers ---------- */
    function renderOffers(el) {
      if (!myOffers.length) { el.innerHTML = '<div class="empty-state">' + vlI18n.t('market_no_offers') + '</div>'; return; }
      el.innerHTML = myOffers.map(o =>
        '<div class="rfq-card"><div class="rfq-top"><div><div class="rfq-title">' + esc(o.rfq_title||'Offer #'+o.id) + '</div>' +
        '<div class="rfq-buyer">' + vlI18n.t('market_your_price') + ': $' + (o.price||'') + '/kg</div></div>' +
        '<span class="rfq-tag status-' + (o.status||'pending') + '">' + (o.status||'pending') + '</span></div>' +
        (o.quantity ? '<div class="rfq-meta"><span class="rfq-tag qty">' + o.quantity + ' kg</span></div>' : '') +
        '</div>'
      ).join('');
    }

    /* ── RFQ Detail overlay ───────────────────────────────── */
    function showRfqDetail(id) {
      const overlay = document.getElementById('detailOverlay');
      overlay.classList.add('show');
      document.getElementById('detailBody').innerHTML = '<div class="loading-state">Loading...</div>';
      const r = allRfqs.find(x => x.id === id);
      if (!r) { overlay.classList.remove('show'); return; }
      document.getElementById('detailTitle').textContent = r.rfq_number || 'RFQ #' + r.id;
      let html = '<div class="detail-section"><h3>' + vlI18n.t('market_rfq_details') + '</h3>';
      html += infoRow(vlI18n.t('market_buyer'), r.buyer_organization||'');
      html += infoRow(vlI18n.t('market_coffee_type'), r.variety||'');
      html += infoRow(vlI18n.t('market_quantity'), r.quantity_kg ? r.quantity_kg+' kg' : '');
      html += infoRow(vlI18n.t('market_deadline'), r.delivery_deadline ? fmtDate(r.delivery_deadline) : '');
      html += infoRow(vlI18n.t('market_status'), r.status||'');
      if (r.processing_method) html += infoRow('Processing', r.processing_method);
      if (r.grade) html += infoRow('Grade', r.grade);
      if (r.delivery_location) html += infoRow('Delivery Location', r.delivery_location);
      html += '</div>';
      html += '<div class="offer-form"><h3>' + vlI18n.t('market_submit_offer') + '</h3>' +
        '<div class="form-group"><label>' + vlI18n.t('market_price') + '</label><input type="number" id="offerPrice" step="0.01" placeholder="e.g. 4.50"></div>' +
        '<div class="form-group"><label>' + vlI18n.t('market_quantity') + '</label><input type="number" id="offerQty" placeholder="e.g. 500"></div>' +
        '<div class="form-group"><label>' + vlI18n.t('market_notes') + '</label><textarea id="offerNotes" placeholder="' + vlI18n.t('market_notes_placeholder') + '"></textarea></div>' +
        '<button class="vl-btn-primary" style="width:100%" onclick="submitOffer(' + id + ')">' + vlI18n.t('market_submit') + '</button></div>';
      document.getElementById('detailBody').innerHTML = html;

      // Load offers for this RFQ
      loadRfqOffers(id, html);
    }

    /* ── Container Detail overlay ─────────────────────────── */
    function showContainerDetail(id) {
      const overlay = document.getElementById('detailOverlay');
      overlay.classList.add('show');
      const c = myContainers.find(x => x.id === id);
      if (!c) { overlay.classList.remove('show'); return; }
      document.getElementById('detailTitle').textContent = c.variety || 'Container';
      const pct = c.fill_percentage || 0;
      const barCls = pct >= 80 ? 'high' : pct >= 50 ? 'mid' : 'low';
      let html = '<div class="detail-section"><h3>' + vlI18n.t('market_container_info') + '</h3>';
      html += infoRow('SSCC', c.container_sscc);
      html += infoRow(vlI18n.t('market_coffee_type'), c.variety || '');
      html += infoRow(vlI18n.t('market_grade'), c.grade || '');
      html += infoRow(vlI18n.t('market_processing'), c.processing_method || '');
      html += infoRow(vlI18n.t('market_price'), '$' + c.price_per_kg + '/kg');
      html += infoRow(vlI18n.t('market_total'), fmt(c.total_quantity_kg) + ' kg');
      html += infoRow(vlI18n.t('market_available_qty'), fmt(c.available_quantity_kg) + ' kg');
      html += infoRow(vlI18n.t('market_sold'), fmt(c.sold_quantity_kg||0) + ' kg');
      html += infoRow(vlI18n.t('market_status'), (c.status||'').replace(/_/g, ' '));
      if (c.created_at) html += infoRow(vlI18n.t('market_listed'), fmtDate(c.created_at));
      if (c.expires_at) html += infoRow(vlI18n.t('market_expires'), fmtDate(c.expires_at));
      html += '</div>';

      /* Fill progress section */
      html += '<div class="detail-section"><h3>' + vlI18n.t('market_fill_progress') + '</h3>';
      html += '<div class="fill-bar-wrap"><div class="fill-bar-header"><span>' + fmt(c.total_quantity_kg - c.available_quantity_kg) + ' / ' + fmt(c.total_quantity_kg) + ' kg</span><span class="pct">' + Math.round(pct) + '%</span></div>';
      html += '<div class="fill-bar"><div class="fill-bar-inner ' + barCls + '" style="width:' + Math.min(pct,100) + '%"></div></div></div>';
      html += '<div style="margin-top:12px">';
      html += infoRow(vlI18n.t('market_buyers'), (c.buyer_count||0) + '');
      html += infoRow(vlI18n.t('market_pools'), (c.pool_count||0) + '');
      if (c.pool_regions && c.pool_regions.length) {
        html += '<div style="display:flex;gap:4px;flex-wrap:wrap;margin-top:10px">';
        c.pool_regions.forEach(r => { html += '<span class="region-chip">' + esc(r) + '</span>'; });
        html += '</div>';
      }
      html += '</div></div>';

      if (c.description) {
        html += '<div class="detail-section"><h3>' + vlI18n.t('market_notes') + '</h3>';
        html += '<p style="font-size:13px;color:var(--stone-600);line-height:1.5">' + esc(c.description) + '</p></div>';
      }

      document.getElementById('detailBody').innerHTML = html;
    }

    /* ── Helpers ───────────────────────────────────────────── */
    function esc(s) { return s ? String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;') : ''; }
    function fmt(n) { return n != null ? Number(n).toLocaleString() : '0'; }
    function fmtDate(d) { try { return new Date(d).toLocaleDateString(); } catch(e) { return d; } }
    function infoRow(l,v) { return '<div class="info-row"><div class="info-label">' + l + '</div><div class="info-value">' + (v||'&mdash;') + '</div></div>'; }

    async function submitOffer(rfqId) {
      const price = document.getElementById('offerPrice').value;
      const qty = document.getElementById('offerQty').value;
      const notes = document.getElementById('offerNotes').value;
      if (!price) { tg.showAlert(vlI18n.t('market_price_required')); return; }
      try {
        const res = await fetch('/api/marketplace/offers', {
          method: 'POST',
          headers: { ...headers, 'Content-Type': 'application/json' },
          body: JSON.stringify({ rfq_id: rfqId, price: parseFloat(price), quantity: qty ? parseFloat(qty) : null, notes }),
        });
        if (!res.ok) throw new Error('Server ' + res.status);
        tg.showAlert(vlI18n.t('market_success'));
        document.getElementById('detailOverlay').classList.remove('show');
        loadData();
      } catch (e) { console.error(e); tg.showAlert(vlI18n.t('market_offer_failed')); }
    }

    document.getElementById('detailBack').addEventListener('click', () => { document.getElementById('detailOverlay').classList.remove('show'); });

    vlTabBar('market');
    loadData();
  </script>
</body>
</html>
