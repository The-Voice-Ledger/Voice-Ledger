<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Voice Ledger &ndash; Trace</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="/miniapps/shared/theme.css">
  <style>
    body{padding:0 0 80px;background:var(--bg)}
    .page-header{padding:20px 16px 14px;background:white;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
    .page-header h1{font-size:20px;font-weight:700;color:var(--stone-800)}
    .search-section{padding:16px}
    .search-box{display:flex;gap:8px}
    .search-box input{flex:1;padding:10px 14px;border:1px solid var(--border);border-radius:var(--r-md);font-size:13px;background:white;outline:none}
    .search-box input:focus{border-color:var(--stone-800)}
    .search-box button{padding:10px 16px;border-radius:var(--r-md);border:none;background:var(--stone-800);color:white;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap}
    .search-box button:active{opacity:.85}
    .recent-list{padding:0 16px}
    .recent-title{font-size:12px;font-weight:700;color:var(--stone-400);text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px}
    .recent-chip{display:inline-block;padding:6px 14px;border-radius:99px;background:white;border:1px solid var(--border);font-size:12px;color:var(--stone-600);cursor:pointer;margin:0 6px 8px 0;transition:all .15s}
    .recent-chip:active{background:var(--stone-100)}
    .journey-container{padding:16px;display:none}
    .journey-container.show{display:block}
    .journey-header{background:white;border:1px solid var(--border);border-radius:var(--r-lg);padding:16px;margin-bottom:16px}
    .journey-batch-id{font-size:16px;font-weight:700;color:var(--stone-800)}
    .journey-meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
    .jm-tag{padding:3px 8px;border-radius:99px;font-size:11px;font-weight:500;background:var(--stone-100);color:var(--stone-600)}
    .timeline{padding-left:20px;position:relative}
    .timeline::before{content:'';position:absolute;left:7px;top:4px;bottom:4px;width:2px;background:var(--stone-200)}
    .tl-item{position:relative;padding-bottom:24px}
    .tl-item:last-child{padding-bottom:0}
    .tl-dot{position:absolute;left:-20px;top:3px;width:16px;height:16px;border-radius:50%;border:2px solid white;box-shadow:0 0 0 2px var(--stone-300);display:flex;align-items:center;justify-content:center}
    .tl-dot.active{box-shadow:0 0 0 2px var(--emerald-500)}
    .tl-dot-inner{width:8px;height:8px;border-radius:50%;background:var(--stone-400)}
    .tl-dot.active .tl-dot-inner{background:var(--emerald-500)}
    .tl-card{background:white;border:1px solid var(--border);border-radius:var(--r-lg);padding:14px;margin-left:8px}
    .tl-type{font-size:13px;font-weight:700;color:var(--stone-800);margin-bottom:2px}
    .tl-time{font-size:11px;color:var(--stone-400);margin-bottom:6px}
    .tl-detail{font-size:12px;color:var(--stone-500);line-height:1.5}
    .tl-hash{margin-top:8px;padding:6px 10px;background:var(--stone-50);border-radius:var(--r-sm);font-size:10px;font-family:monospace;color:var(--stone-500);word-break:break-all}
    .bc-section{background:white;border:1px solid var(--border);border-radius:var(--r-lg);padding:16px;margin-top:16px}
    .bc-section h3{font-size:12px;font-weight:700;color:var(--stone-400);text-transform:uppercase;letter-spacing:.06em;margin-bottom:12px;display:flex;align-items:center;gap:6px}
    .bc-section h3 svg{width:14px;height:14px;color:var(--emerald-500)}
    .info-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--stone-100)}
    .info-row:last-child{border-bottom:none}
    .info-label{font-size:12px;color:var(--stone-400)}
    .info-value{font-size:12px;font-weight:600;color:var(--stone-800);max-width:60%;text-align:right;word-break:break-all}
    .empty-state{text-align:center;padding:48px 16px;color:var(--stone-400)}
    .loading-state{text-align:center;padding:48px;color:var(--stone-400)}
  </style>
</head>
<body>
  <div class="page-header">
    <h1 data-i18n="trace_title">Trace &amp; Verify</h1>
    <div class="vl-lang-toggle"><button data-lang="en">EN</button><button data-lang="am">&#4771;&#4635;</button></div>
  </div>
  <div class="search-section">
    <div class="search-box">
      <input type="text" id="traceInput" placeholder="Enter Batch ID...">
      <button id="traceBtn" data-i18n="trace_title">Trace</button>
    </div>
  </div>
  <div class="recent-list" id="recentSection">
    <div class="recent-title">Recent Batches</div>
    <div id="recentChips"></div>
  </div>
  <div class="journey-container" id="journeyContainer">
    <div class="journey-header" id="journeyHeader"></div>
    <div class="timeline" id="timeline"></div>
    <div class="bc-section" id="bcSection" style="display:none"></div>
  </div>

  <script src="/miniapps/shared/i18n.js"></script>
  <script src="/miniapps/shared/tab-bar.js"></script>
  <script>
    const tg = window.Telegram.WebApp;
    tg.expand(); tg.ready();
    tg.BackButton.show();
    tg.BackButton.onClick(() => { window.location.href = '/miniapps/index.html'; });
    const user = tg.initDataUnsafe.user;
    if (user && user.language_code === 'am' && !localStorage.getItem('vl_lang')) vlI18n.setLang('am');

    function getRecent() { try { return JSON.parse(localStorage.getItem('vl_trace_recent')||'[]'); } catch { return []; } }
    function addRecent(id) {
      let list = getRecent().filter(x => x !== id);
      list.unshift(id);
      if (list.length > 8) list = list.slice(0, 8);
      localStorage.setItem('vl_trace_recent', JSON.stringify(list));
      renderRecent();
    }
    function renderRecent() {
      const list = getRecent();
      const el = document.getElementById('recentChips');
      if (!list.length) { document.getElementById('recentSection').style.display = 'none'; return; }
      document.getElementById('recentSection').style.display = '';
      el.innerHTML = list.map(id => '<span class="recent-chip" onclick="traceBatch(\'' + id + '\')">' + id + '</span>').join('');
    }

    async function loadUserBatches() {
      try {
        const res = await fetch('/api/miniapp/batches?user_id=' + (user?.id || 0), { headers: { 'X-Telegram-User-Id': String(user?.id || 0) } });
        if (!res.ok) return;
        const data = await res.json();
        const batches = data.batches || data || [];
        if (batches.length && !getRecent().length) {
          batches.slice(0, 5).forEach(b => { const id = b.batch_id || b.id; if (id) addRecent(id); });
        }
      } catch {}
    }

    async function traceBatch(id) {
      if (!id) return;
      document.getElementById('traceInput').value = id;
      addRecent(id);
      const container = document.getElementById('journeyContainer');
      const timeline = document.getElementById('timeline');
      const header = document.getElementById('journeyHeader');
      const bcEl = document.getElementById('bcSection');
      container.classList.add('show');
      timeline.innerHTML = '<div class="loading-state">Loading...</div>';
      bcEl.style.display = 'none';
      try {
        const res = await fetch('/api/miniapp/trace/' + encodeURIComponent(id) + '?user_id=' + (user?.id || 0), { headers: { 'X-Telegram-User-Id': String(user?.id || 0) } });
        if (!res.ok) throw new Error('Server ' + res.status);
        const data = await res.json();
        const batch = data.batch || data;
        header.innerHTML = '<div class="journey-batch-id">' + (batch.batch_id||id) + '</div><div class="journey-meta">' +
          (batch.origin ? '<span class="jm-tag">' + batch.origin + '</span>' : '') +
          (batch.grade ? '<span class="jm-tag">' + batch.grade + '</span>' : '') +
          (batch.weight ? '<span class="jm-tag">' + batch.weight + ' kg</span>' : '') +
          ((batch.display_status||batch.status) ? '<span class="jm-tag" style="background:#dcfce7;color:#166534">' + (batch.display_status||batch.status) + '</span>' : '') +
          '</div>';
        const events = data.events || data.timeline || batch.events || [];
        if (!events.length) {
          timeline.innerHTML = '<div class="empty-state">No events recorded yet</div>';
        } else {
          timeline.innerHTML = events.map((ev, i) => {
            const isLast = i === events.length - 1;
            const type = ev.event_type||ev.type||ev.action||'Event';
            const time = ev.timestamp||ev.created_at||ev.date||'';
            const loc = ev.location||ev.biz_location||'';
            const actor = ev.actor||ev.recorded_by||'';
            const hash = ev.blockchain_hash||ev.tx_hash||(ev.blockchain&&ev.blockchain.transaction_hash)||'';
            let parts = [];
            if (loc) parts.push(loc);
            if (actor) parts.push(actor);
            if (ev.notes) parts.push(ev.notes);
            return '<div class="tl-item"><div class="tl-dot ' + (isLast?'active':'') + '"><div class="tl-dot-inner"></div></div>' +
              '<div class="tl-card"><div class="tl-type">' + type + '</div><div class="tl-time">' + formatTime(time) + '</div>' +
              (parts.length ? '<div class="tl-detail">' + parts.join(' &middot; ') + '</div>' : '') +
              (hash ? '<div class="tl-hash">tx: ' + hash + '</div>' : '') +
              '</div></div>';
          }).join('');
        }
        const bc = data.blockchain||batch.blockchain||{};
        const txHash = bc.transaction_hash||batch.blockchain_hash||'';
        if (txHash) {
          bcEl.style.display = '';
          bcEl.innerHTML = '<h3><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg> ' + vlI18n.t('trace_blockchain') + '</h3>' +
            '<div class="info-row"><div class="info-label">Tx Hash</div><div class="info-value" style="font-family:monospace;font-size:10px">' + txHash + '</div></div>' +
            (bc.block_number ? '<div class="info-row"><div class="info-label">Block</div><div class="info-value">' + bc.block_number + '</div></div>' : '') +
            (bc.network ? '<div class="info-row"><div class="info-label">Network</div><div class="info-value">' + bc.network + '</div></div>' : '') +
            (bc.token_id ? '<div class="info-row"><div class="info-label">Token ID</div><div class="info-value">' + bc.token_id + '</div></div>' : '');
        }
      } catch (e) {
        console.error('Trace error:', e);
        timeline.innerHTML = '<div class="empty-state">Failed to load trace data</div>';
      }
    }

    function formatTime(t) {
      if (!t) return '';
      try { return new Date(t).toLocaleDateString('en-US', { month:'short', day:'numeric', year:'numeric', hour:'2-digit', minute:'2-digit' }); }
      catch { return t; }
    }

    document.getElementById('traceBtn').addEventListener('click', () => { traceBatch(document.getElementById('traceInput').value.trim()); });
    document.getElementById('traceInput').addEventListener('keydown', (e) => { if (e.key === 'Enter') traceBatch(e.target.value.trim()); });

    const urlParams = new URLSearchParams(window.location.search);
    const batchParam = urlParams.get('batch') || urlParams.get('id');

    vlTabBar('home');
    renderRecent();
    loadUserBatches();
    if (batchParam) traceBatch(batchParam);
  </script>
</body>
</html>
