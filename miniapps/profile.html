<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Voice Ledger &ndash; Profile</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="/miniapps/shared/theme.css">
  <style>
    body{padding:20px 16px 88px;background:var(--bg)}
    .profile-header{text-align:center;margin-bottom:28px}
    .avatar-ring{
      width:88px;height:88px;margin:0 auto 14px;border-radius:50%;
      background:var(--stone-800);display:flex;align-items:center;justify-content:center;
      box-shadow:0 4px 20px rgba(0,0,0,.12);
    }
    .avatar-ring span{font-size:34px;font-weight:700;color:white}
    .profile-name{font-size:22px;font-weight:700;color:var(--stone-800);margin-bottom:4px}
    .role-badge{
      display:inline-block;padding:4px 12px;border-radius:99px;
      font-size:12px;font-weight:600;margin-top:4px;
    }
    .role-badge.farmer{background:#dcfce7;color:#166534}
    .role-badge.cooperative{background:#dbeafe;color:#1e40af}
    .role-badge.exporter{background:#fef3c7;color:#92400e}
    .role-badge.buyer{background:#e0e7ff;color:#3730a3}
    .approved-check{
      display:inline-flex;align-items:center;gap:4px;
      font-size:11px;color:var(--emerald-600);margin-left:6px;
    }
    .section{
      background:white;border:1px solid var(--border);border-radius:var(--r-lg);
      padding:18px;margin-bottom:16px;
    }
    .section-title{
      font-size:13px;font-weight:700;color:var(--stone-400);
      text-transform:uppercase;letter-spacing:.06em;margin-bottom:14px;
      display:flex;align-items:center;gap:8px;
    }
    .section-title svg{width:16px;height:16px;color:var(--stone-400)}
    .info-row{
      display:flex;justify-content:space-between;align-items:center;
      padding:10px 0;border-bottom:1px solid var(--stone-100);
    }
    .info-row:last-child{border-bottom:none}
    .info-label{font-size:13px;color:var(--stone-400);font-weight:500}
    .info-value{font-size:13px;color:var(--stone-800);font-weight:600;text-align:right;max-width:55%;word-break:break-all}
    .loading-state{text-align:center;padding:40px;color:var(--stone-400)}
  </style>
</head>
<body>
  <div id="profileContent">
    <div class="loading-state" data-i18n="loading">Loading...</div>
  </div>

  <script src="/miniapps/shared/i18n.js"></script>
  <script src="/miniapps/shared/tab-bar.js"></script>
  <script>
    const tg = window.Telegram.WebApp;
    tg.expand(); tg.ready();
    tg.BackButton.show();
    tg.BackButton.onClick(() => { window.location.href = '/miniapps/index.html'; });

    const user = tg.initDataUnsafe.user;
    if (user && user.language_code === 'am' && !localStorage.getItem('vl_lang')) {
      vlI18n.setLang('am');
    }

    function getInitials(name) {
      if (!name) return '?';
      const parts = name.trim().split(' ');
      if (parts.length >= 2) return (parts[0][0] + parts[1][0]).toUpperCase();
      return name.substring(0, 2).toUpperCase();
    }

    async function loadProfile() {
      try {
        let profile;
        const res = await fetch('/api/users/me/profile', {
          headers: { 'X-Telegram-User-Id': user?.id || 0, 'Content-Type': 'application/json' }
        });
        if (res.ok) {
          profile = await res.json();
          profile.full_name = profile.name || profile.full_name;
        } else {
          profile = buildFallback();
        }
        renderProfile(profile);
      } catch (e) {
        console.error('Profile load error:', e);
        renderProfile(buildFallback());
      }
    }

    function buildFallback() {
      return {
        full_name: ((user?.first_name || '') + ' ' + (user?.last_name || '')).trim(),
        role: 'FARMER', is_approved: true,
        telegram_user_id: user?.id,
        phone_number: null, preferred_language: vlI18n.getLang(),
        organization: null,
      };
    }

    function renderProfile(p) {
      const initials = getInitials(p.full_name || p.name);
      const role = (p.role || 'FARMER').toLowerCase();
      const t = vlI18n.t.bind(vlI18n);
      document.getElementById('profileContent').innerHTML =
        '<div class="profile-header">' +
          '<div class="avatar-ring"><span>' + initials + '</span></div>' +
          '<div class="profile-name">' + (p.full_name || p.name || 'User') + '</div>' +
          '<span class="role-badge ' + role + '">' + (p.role || 'FARMER') + '</span>' +
          (p.is_approved ? '<span class="approved-check">&#10003; ' + t('profile_approved') + '</span>' : '') +
          '<div class="vl-lang-toggle" style="margin-top:12px"><button data-lang="en">EN</button><button data-lang="am">&#4771;&#4635;</button></div>' +
        '</div>' +
        '<div class="section">' +
          '<div class="section-title"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg><span data-i18n="profile_account">' + t('profile_account') + '</span></div>' +
          '<div class="info-row"><div class="info-label" data-i18n="profile_telegram_id">' + t('profile_telegram_id') + '</div><div class="info-value">' + (p.telegram_user_id || 'N/A') + '</div></div>' +
          '<div class="info-row"><div class="info-label" data-i18n="profile_phone">' + t('profile_phone') + '</div><div class="info-value">' + (p.phone_number || '&mdash;') + '</div></div>' +
          '<div class="info-row"><div class="info-label" data-i18n="profile_role">' + t('profile_role') + '</div><div class="info-value">' + (p.role || 'FARMER') + '</div></div>' +
          '<div class="info-row"><div class="info-label" data-i18n="profile_org">' + t('profile_org') + '</div><div class="info-value">' + (p.organization || '&mdash;') + '</div></div>' +
          '<div class="info-row"><div class="info-label" data-i18n="profile_language">' + t('profile_language') + '</div><div class="info-value">' + (p.preferred_language === 'am' ? '&#4771;&#4635;&#4653;&#4763;' : 'English') + '</div></div>' +
          (p.did ? '<div class="info-row"><div class="info-label">DID</div><div class="info-value mono" style="font-size:11px">' + p.did + '</div></div>' : '') +
        '</div>';
      vlI18n.translatePage();
    }

    vlTabBar('profile');
    loadProfile();
  </script>
</body>
</html>
