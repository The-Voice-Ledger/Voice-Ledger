<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="/miniapps/shared/voice.js"></script>
    <link rel="stylesheet" href="/css/theme.css">
    <style>
        body { padding: 20px; padding-top: 80px; min-height: 100vh; }
        .voice-button { position: fixed; top: 20px; right: 20px; width: 48px; height: 48px; border-radius: 50%; background: var(--primary-blue); border: none; cursor: pointer; box-shadow: 0 2px 8px rgba(0,0,0,0.15); display: flex; align-items: center; justify-content: center; transition: all 0.3s ease; z-index: 1000; }
        .voice-button:hover { background: var(--primary-blue-dark); transform: scale(1.05); }
        .voice-button svg { width: 24px; height: 24px; color: white; }
        .voice-button:nth-child(2) { right: 78px; width: 40px; height: 40px; background: #6366f1; }
        .voice-button:nth-child(2):hover { background: #4f46e5; }
        .voice-button:nth-child(2) svg { width: 20px; height: 20px; }
        .voice-button.recording { animation: pulse 1.5s ease-in-out infinite; background: #ef4444; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.6; } }
        
        .profile-header { text-align: center; margin-bottom: 32px; }
        .avatar-container { width: 100px; height: 100px; margin: 0 auto 16px; border-radius: 50%; background: var(--gradient-blue); display: flex; align-items: center; justify-content: center; box-shadow: var(--shadow-lg); position: relative; }
        .avatar-container::before { content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0; border-radius: 50%; background: var(--gradient-glossy); pointer-events: none; }
        .avatar-initials { font-size: 40px; font-weight: 700; color: white; z-index: 1; }
        .profile-name { font-size: 24px; font-weight: 700; color: var(--primary-blue-dark); margin-bottom: 4px; }
        .profile-role { font-size: 14px; color: #6b7280; text-transform: uppercase; letter-spacing: 0.5px; }
        .role-badge { padding: 6px 12px; border-radius: 8px; font-size: 12px; font-weight: 600; display: inline-block; margin-top: 8px; }
        .role-badge.farmer { background: #dcfce7; color: #166534; }
        .role-badge.cooperative { background: #dbeafe; color: #1e40af; }
        .role-badge.exporter { background: #fef3c7; color: #92400e; }
        
        .stats-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-bottom: 24px; }
        .stat-card { background: white; border-radius: 12px; padding: 20px 16px; box-shadow: var(--shadow-md); position: relative; overflow: hidden; text-align: center; }
        .stat-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 50%; background: var(--gradient-glossy); pointer-events: none; }
        .stat-icon { width: 32px; height: 32px; margin: 0 auto 8px; color: var(--primary-blue); }
        .stat-value { font-size: 28px; font-weight: 700; color: var(--primary-blue-dark); margin-bottom: 4px; }
        .stat-label { font-size: 12px; color: #6b7280; text-transform: uppercase; letter-spacing: 0.5px; }
        
        .section { background: white; border-radius: 12px; padding: 20px; box-shadow: var(--shadow-md); margin-bottom: 20px; position: relative; overflow: hidden; }
        .section::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 40%; background: var(--gradient-glossy); pointer-events: none; }
        .section-title { font-size: 18px; font-weight: 700; color: var(--primary-blue-dark); margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }
        .section-title svg { width: 20px; height: 20px; color: var(--primary-blue); }
        
        .info-row { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid #f3f4f6; }
        .info-row:last-child { border-bottom: none; }
        .info-label { font-size: 14px; color: #6b7280; font-weight: 500; }
        .info-value { font-size: 14px; color: var(--primary-blue-dark); font-weight: 600; }
        
        .credential-item { display: flex; align-items: center; gap: 12px; padding: 12px; background: #f9fafb; border-radius: 8px; margin-bottom: 8px; }
        .credential-icon { width: 40px; height: 40px; border-radius: 8px; background: var(--gradient-blue); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
        .credential-icon svg { width: 20px; height: 20px; color: white; }
        .credential-content { flex: 1; }
        .credential-name { font-size: 14px; font-weight: 600; color: var(--primary-blue-dark); margin-bottom: 2px; }
        .credential-date { font-size: 12px; color: #6b7280; }
        .credential-status { padding: 4px 8px; border-radius: 6px; font-size: 11px; font-weight: 600; }
        .credential-status.verified { background: #dcfce7; color: #166534; }
        .credential-status.pending { background: #fef3c7; color: #92400e; }
        
        .timeline { position: relative; padding-left: 24px; }
        .timeline::before { content: ''; position: absolute; left: 6px; top: 0; bottom: 0; width: 2px; background: #e5e7eb; }
        .timeline-item { position: relative; margin-bottom: 20px; }
        .timeline-item::before { content: ''; position: absolute; left: -22px; top: 4px; width: 12px; height: 12px; border-radius: 50%; background: var(--primary-blue); border: 2px solid white; box-shadow: 0 0 0 2px var(--primary-blue); }
        .timeline-time { font-size: 12px; color: #6b7280; margin-bottom: 4px; }
        .timeline-content { font-size: 14px; color: var(--primary-blue-dark); line-height: 1.5; }
        
        .loading { text-align: center; padding: 40px; color: #6b7280; }
        .error-state { text-align: center; padding: 40px; color: #ef4444; }
    </style>
</head>
<body>
    <svg style="display: none;">
        <symbol id="icon-microphone" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M19 10v2a7 7 0 0 1-14 0v-2"/><line fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" x1="12" y1="19" x2="12" y2="23"/><line fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" x1="8" y1="23" x2="16" y2="23"/></symbol>
        <symbol id="icon-user" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" cx="12" cy="7" r="4"/></symbol>
        <symbol id="icon-coffee" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M18 8h1a4 4 0 0 1 0 8h-1"/><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4V8z"/><line fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" x1="6" y1="1" x2="6" y2="4"/><line fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" x1="10" y1="1" x2="10" y2="4"/><line fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" x1="14" y1="1" x2="14" y2="4"/></symbol>
        <symbol id="icon-check" viewBox="0 0 24 24"><polyline fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" points="20 6 9 17 4 12"/></symbol>
        <symbol id="icon-document" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" points="14 2 14 8 20 8"/><line fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" x1="16" y1="13" x2="8" y2="13"/><line fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" x1="16" y1="17" x2="8" y2="17"/><polyline fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" points="10 9 9 9 8 9"/></symbol>
        <symbol id="icon-star" viewBox="0 0 24 24"><polygon fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></symbol>
        <symbol id="icon-package" viewBox="0 0 24 24"><line fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" x1="16.5" y1="9.4" x2="7.5" y2="4.21"/><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" points="3.27 6.96 12 12.01 20.73 6.96"/><line fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" x1="12" y1="22.08" x2="12" y2="12"/></symbol>
        <symbol id="icon-activity" viewBox="0 0 24 24"><polyline fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" points="22 12 18 12 15 21 9 3 6 12 2 12"/></symbol>
    </svg>

    <button class="voice-button" id="voiceButton"><svg><use href="#icon-microphone"/></svg></button>
    <button class="voice-button" id="voiceHelpButton"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg></button>

    <div id="profileContent">
        <div class="loading">Loading profile...</div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.ready();
        tg.BackButton.show();
        tg.BackButton.onClick(() => { window.location.href = '/miniapps/index'; });

        let currentProfile = null; // Store current profile data
        
        // Voice Interface - Initialize BEFORE functions that use it
        const voiceInterface = new VoiceInterface(tg, {
            context: {
                app: 'profile',
                view: 'view'
            }
        });
        
        /**
         * Update voice context dynamically (Priority 1: Context Precision)
         * Call this whenever profile data changes
         */
        function updateVoiceContext() {
            if (currentProfile) {
                voiceInterface.setContext({
                    view: 'view',
                    profile: {
                        name: currentProfile.full_name || currentProfile.name,
                        role: currentProfile.role,
                        phone_number: currentProfile.phone_number,
                        organization: currentProfile.organization,
                        language: currentProfile.preferred_language,
                        is_approved: currentProfile.is_approved,
                        telegram_user_id: currentProfile.telegram_user_id
                    },
                    available_actions: ['update_profile', 'change_language', 'update_phone', 'view_credentials'],
                    editable_fields: ['name', 'phone_number', 'organization', 'preferred_language']
                });
            } else {
                voiceInterface.setContext({
                    view: 'loading',
                    available_actions: []
                });
            }
            
            console.log('Voice context updated - Profile loaded:', !!currentProfile);
        }

        function getInitials(name) {
            if (!name) return 'U';
            const parts = name.trim().split(' ');
            if (parts.length === 1) return parts[0].charAt(0).toUpperCase();
            return (parts[0].charAt(0) + parts[parts.length - 1].charAt(0)).toUpperCase();
        }

        function formatDate(dateString) {
            if (!dateString) return 'N/A';
            const date = new Date(dateString);
            return date.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
        }

        function formatDateTime(dateString) {
            if (!dateString) return 'N/A';
            const date = new Date(dateString);
            const now = new Date();
            const diffMs = now - date;
            const diffMins = Math.floor(diffMs / 60000);
            const diffHours = Math.floor(diffMs / 3600000);
            const diffDays = Math.floor(diffMs / 86400000);

            if (diffMins < 1) return 'Just now';
            if (diffMins < 60) return `${diffMins}m ago`;
            if (diffHours < 24) return `${diffHours}h ago`;
            if (diffDays < 7) return `${diffDays}d ago`;
            return date.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
        }

        async function loadProfile() {
            try {
                // Try the profile endpoint first
                let response = await fetch('/api/users/me/profile', {
                    headers: { 
                        'X-Telegram-User-Id': tg.initDataUnsafe.user?.id || 0,
                        'Content-Type': 'application/json'
                    }
                });
                
                let profile;
                if (response.ok) {
                    profile = await response.json();
                    // API returns 'name', so use it directly
                    profile.full_name = profile.name;
                } else {
                    // Fallback: create profile from Telegram data
                    const user = tg.initDataUnsafe.user;
                    profile = {
                        name: `${user?.first_name || ''} ${user?.last_name || ''}`.trim(),
                        full_name: `${user?.first_name || ''} ${user?.last_name || ''}`.trim(),
                        role: 'FARMER',
                        is_approved: true,
                        telegram_user_id: user?.id,
                        phone_number: null,
                        preferred_language: 'en',
                        organization: null
                    };
                }
                
                renderProfile(profile);
            } catch (error) {
                console.error('Error loading profile:', error);
                // Create basic profile from Telegram data
                const user = tg.initDataUnsafe.user;
                const profile = {
                    name: `${user?.first_name || ''} ${user?.last_name || ''}`.trim(),
                    full_name: `${user?.first_name || ''} ${user?.last_name || ''}`.trim(),
                    role: 'FARMER',
                    telegram_user_id: user?.id,
                    phone_number: null,
                    preferred_language: 'en',
                    organization: null
                };
                renderProfile(profile);
            }
        }

        function renderProfile(profile) {
            currentProfile = profile; // Store for voice context
            
            const initials = getInitials(profile.full_name || profile.name);
            const roleBadgeClass = (profile.role || 'farmer').toLowerCase();
            
            const html = `
                <div class="profile-header">
                    <div class="avatar-container">
                        <div class="avatar-initials">${initials}</div>
                    </div>
                    <div class="profile-name">${profile.full_name || profile.name || 'User'}</div>
                    <div class="profile-role">
                        <span class="role-badge ${roleBadgeClass}">${profile.role || 'FARMER'}</span>
                        ${profile.is_approved ? '<span class="approval-badge">✓ Approved</span>' : ''}
                    </div>
                </div>

                <div class="section">
                    <div class="section-title">
                        <svg><use href="#icon-user"/></svg>
                        Account Information
                    </div>
                    <div class="info-row">
                        <div class="info-label">Telegram ID</div>
                        <div class="info-value">${profile.telegram_user_id || 'N/A'}</div>
                    </div>
                    <div class="info-row">
                        <div class="info-label">Phone Number</div>
                        <div class="info-value">${profile.phone_number || 'Not set'}</div>
                    </div>
                    <div class="info-row">
                        <div class="info-label">Role</div>
                        <div class="info-value">${profile.role || 'FARMER'}</div>
                    </div>
                    <div class="info-row">
                        <div class="info-label">Organization</div>
                        <div class="info-value">${profile.organization || 'None'}</div>
                    </div>
                    <div class="info-row">
                        <div class="info-label">Language</div>
                        <div class="info-value">${profile.preferred_language === 'am' ? 'Amharic' : 'English'}</div>
                    </div>
                </div>
            `;
            
            document.getElementById('profileContent').innerHTML = html;
            
            // Update voice context after rendering (Priority 1)
            updateVoiceContext();
        }

        function getInitials(name) {
            if (!name) return '?';
            const parts = name.split(' ');
            if (parts.length >= 2) {
                return (parts[0][0] + parts[1][0]).toUpperCase();
            }
            return name.substring(0, 2).toUpperCase();
        }

        const voiceButton = document.getElementById('voiceButton');

        voiceButton.addEventListener('click', async () => {
            if (!voiceInterface.isRecording) {
                await voiceInterface.startRecording(voiceButton);
            } else {
                await voiceInterface.stopRecording(voiceButton);
            }
        });
        
        document.getElementById('voiceHelpButton').addEventListener('click', () => {
            tg.showPopup({
                title: '🎤 Voice Commands',
                message: 'Try saying:\n\n• "Change my phone number to..."\n• "Update my language to Amharic"\n• "What\'s my DID?"\n• "Show my credentials"\n• "Change my name"\n\nTip: You can update any profile field using voice.',
                buttons: [{ type: 'ok' }]
            });
        });
        
        // Register action handlers (Priority 3: Complete coverage)
        voiceInterface.onAction('update_profile', async (params) => {
            const field = params.field;
            const value = params.value;
            
            if (!field || !value) {
                tg.showAlert('Please specify what to update (e.g., "update phone to +1234567890")');
                return;
            }
            
            return new Promise(resolve => {
                tg.showPopup({
                    title: '⚠️ Confirm Update',
                    message: `Update ${field} to "${value}"?`,
                    buttons: [
                        { id: 'yes', type: 'default', text: 'Update' },
                        { id: 'no', type: 'cancel' }
                    ]
                }, async (buttonId) => {
                    if (buttonId === 'yes') {
                        try {
                            const response = await fetch('/api/miniapp/profile/update', {
                                method: 'POST',
                                headers: {
                                    'Content-Type': 'application/json',
                                    'X-Telegram-User-Id': String(tg.initDataUnsafe.user?.id)
                                },
                                body: JSON.stringify({ [field]: value })
                            });
                            
                            if (response.ok) {
                                tg.HapticFeedback.notificationOccurred('success');
                                tg.showAlert(`✅ ${field} updated`);
                                loadProfile();
                            } else {
                                tg.showAlert('Update failed');
                            }
                        } catch (error) {
                            console.error('Profile update error:', error);
                            tg.showAlert('Update error: ' + error.message);
                        }
                    }
                    resolve();
                });
            });
        });
        
        voiceInterface.onAction('change_language', async (params) => {
            const lang = params.language || params.lang;
            const validLangs = ['en', 'am', 'english', 'amharic'];
            
            if (!lang) {
                tg.showPopup({
                    title: '🌐 Change Language',
                    message: 'Available languages:\n\n• English\n• Amharic (አማርኛ)',
                    buttons: [{ type: 'ok' }]
                });
                return;
            }
            
            const langCode = lang.toLowerCase().startsWith('am') ? 'am' : 'en';
            
            return new Promise(resolve => {
                tg.showPopup({
                    title: '⚠️ Confirm Language',
                    message: `Change language to ${langCode === 'am' ? 'Amharic' : 'English'}?`,
                    buttons: [
                        { id: 'yes', type: 'default', text: 'Change' },
                        { id: 'no', type: 'cancel' }
                    ]
                }, async (buttonId) => {
                    if (buttonId === 'yes') {
                        try {
                            const response = await fetch('/api/miniapp/profile/update', {
                                method: 'POST',
                                headers: {
                                    'Content-Type': 'application/json',
                                    'X-Telegram-User-Id': String(tg.initDataUnsafe.user?.id)
                                },
                                body: JSON.stringify({ language_preference: langCode })
                            });
                            
                            if (response.ok) {
                                tg.HapticFeedback.notificationOccurred('success');
                                tg.showAlert('✅ Language updated');
                                loadProfile();
                            } else {
                                tg.showAlert('Update failed');
                            }
                        } catch (error) {
                            tg.showAlert('Error: ' + error.message);
                        }
                    }
                    resolve();
                });
            });
        });
        
        voiceInterface.onAction('view_credentials', async (params) => {
            tg.showPopup({
                title: '🎓 Verifiable Credentials',
                message: 'Viewing verifiable credentials...\n\n• Farmer Certificate\n• Cooperative Membership\n• Quality Verification\n\nNote: Full credential viewer coming soon.',
                buttons: [{ type: 'ok' }]
            });
            tg.HapticFeedback.impactOccurred('light');
            // TODO: Navigate to credentials page or open modal
        });

        loadProfile();

        function showError(message) {
            document.getElementById('profileContent').innerHTML = `
                <div class="empty-state">
                    <div class="empty-icon">⚠️</div>
                    <div class="empty-text">${message}</div>
                </div>
            `;
        }
    </script>
</body>
</html>
