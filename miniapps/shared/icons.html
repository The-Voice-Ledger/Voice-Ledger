<script>
// Helper function to render icon
function renderIcon(iconName, size = 24, color = 'currentColor') {
    return `<svg width="${size}" height="${size}" style="color: ${color}; display: inline-block; vertical-align: middle;"><use href="#icon-${iconName}"/></svg>`;
}

// Auto-replace div placeholders with SVG icons
document.addEventListener('DOMContentLoaded', () => {
    document.querySelectorAll('[id^="icon-"]').forEach(el => {
        const iconName = el.id.replace('icon-', '');
        const size = el.getAttribute('data-size') || 24;
        const color = el.getAttribute('data-color') || 'currentColor';
        el.outerHTML = renderIcon(iconName, size, color);
    });
});
</script>
