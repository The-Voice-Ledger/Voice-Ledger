<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="/css/theme.css">
    <style>
        body { padding: 20px; padding-top: 20px; padding-bottom: 72px; min-height: 100vh; }
        .tab-bar { display: flex; justify-content: space-around; align-items: center; background: white; border-top: 1px solid #e5e7eb; padding: 6px 0 env(safe-area-inset-bottom, 6px); position: fixed; bottom: 0; left: 0; right: 0; z-index: 100; }
        .tab-bar a { display: flex; flex-direction: column; align-items: center; gap: 2px; text-decoration: none; padding: 4px 8px; color: #94a3b8; font-size: 10px; font-weight: 500; }
        .tab-bar a.active { color: var(--primary-blue); }
        .tab-bar a svg { width: 22px; height: 22px; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
        h1 { color: var(--primary-blue-dark); font-size: 24px; font-weight: 700; display: flex; align-items: center; gap: 12px; }
        h1 svg { width: 28px; height: 28px; color: var(--primary-blue); }
        .btn-refresh { width: 40px; height: 40px; border-radius: 8px; background: white; border: 1px solid #e5e7eb; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: all 0.2s; }
        .btn-refresh:hover { background: #f9fafb; border-color: var(--primary-blue); }
        .btn-refresh svg { width: 20px; height: 20px; color: var(--primary-blue); }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin-bottom: 24px; }
        .stat-card { background: white; border-radius: 12px; padding: 16px; box-shadow: var(--shadow-md); position: relative; overflow: hidden; }
        .stat-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 50%; background: var(--gradient-glossy); pointer-events: none; }
        .stat-value { font-size: 28px; font-weight: 700; color: var(--primary-blue-dark); margin-bottom: 4px; }
        .stat-label { font-size: 12px; color: #6b7280; text-transform: uppercase; letter-spacing: 0.5px; }
        .tabs { display: flex; gap: 8px; margin-bottom: 20px; border-bottom: 2px solid #e5e7eb; overflow-x: auto; }
        .tab { padding: 12px 20px; border: none; background: none; cursor: pointer; font-size: 14px; font-weight: 600; color: #6b7280; border-bottom: 2px solid transparent; margin-bottom: -2px; transition: all 0.2s; white-space: nowrap; }
        .tab.active { color: var(--primary-blue); border-bottom-color: var(--primary-blue); }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .table-container { background: white; border-radius: 12px; padding: 16px; box-shadow: var(--shadow-md); overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; }
        th { text-align: left; padding: 12px; font-size: 12px; font-weight: 600; color: #6b7280; text-transform: uppercase; border-bottom: 2px solid #e5e7eb; }
        td { padding: 12px; border-bottom: 1px solid #f3f4f6; }
        .user-name { font-weight: 600; color: var(--primary-blue-dark); }
        .role-badge { padding: 4px 8px; border-radius: 8px; font-size: 11px; font-weight: 600; display: inline-block; }
        .role-badge.farmer { background: #dcfce7; color: #166534; }
        .role-badge.cooperative { background: #dbeafe; color: #1e40af; }
        .role-badge.admin { background: #fef3c7; color: #92400e; }
        .status-badge { padding: 4px 8px; border-radius: 8px; font-size: 11px; font-weight: 600; display: inline-block; }
        .status-badge.pending { background: #fef3c7; color: #92400e; }
        .status-badge.approved { background: #dcfce7; color: #166534; }
        .status-badge.rejected { background: #fee2e2; color: #991b1b; }
        .status-badge.open { background: #dbeafe; color: #1e40af; }
        .actions { display: flex; gap: 8px; }
        .btn-action { padding: 6px 12px; border-radius: 6px; border: none; font-size: 12px; font-weight: 600; cursor: pointer; transition: all 0.2s; display: flex; align-items: center; gap: 4px; }
        .btn-action svg { width: 14px; height: 14px; }
        .btn-approve { background: #dcfce7; color: #166534; }
        .btn-approve:hover { background: #bbf7d0; }
        .btn-reject { background: #fee2e2; color: #991b1b; }
        .btn-reject:hover { background: #fecaca; }
        .empty-state { text-align: center; padding: 40px; color: #6b7280; }
        .loading { text-align: center; padding: 40px; color: #6b7280; }
    </style>
</head>
<body>
    <svg style="display: none;">
        <symbol id="icon-microphone" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M19 10v2a7 7 0 0 1-14 0v-2"/><line fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" x1="12" y1="19" x2="12" y2="23"/><line fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" x1="8" y1="23" x2="16" y2="23"/></symbol>
        <symbol id="icon-settings" viewBox="0 0 24 24"><circle fill="none" stroke="currentColor" stroke-width="2" cx="12" cy="12" r="3"/><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M12 1v3m0 16v3M4.22 4.22l2.12 2.12m11.32 11.32l2.12 2.12M1 12h3m16 0h3M4.22 19.78l2.12-2.12m11.32-11.32l2.12-2.12"/></symbol>
        <symbol id="icon-refresh" viewBox="0 0 24 24"><polyline fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" points="23 4 23 10 17 10"/><polyline fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" points="1 20 1 14 7 14"/><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></symbol>
        <symbol id="icon-check" viewBox="0 0 24 24"><polyline fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" points="20 6 9 17 4 12"/></symbol>
        <symbol id="icon-x" viewBox="0 0 24 24"><line fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" x1="18" y1="6" x2="6" y2="18"/><line fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" x1="6" y1="6" x2="18" y2="18"/></symbol>
    </svg>

    <div class="header">
        <h1><svg><use href="#icon-settings"/></svg>Admin Dashboard</h1>
        <button class="btn-refresh" id="refreshBtn"><svg><use href="#icon-refresh"/></svg></button>
    </div>

    <div class="stats-grid" id="statsGrid"><div class="loading">Loading stats...</div></div>

    <div class="tabs">
        <button class="tab active" data-tab="registrations">Registrations</button>
        <button class="tab" data-tab="users">Users</button>
        <button class="tab" data-tab="rfqs">RFQs</button>
        <button class="tab" data-tab="offers">Offers</button>
    </div>

    <div class="tab-content active" id="registrations"><div class="loading">Loading...</div></div>
    <div class="tab-content" id="users"><div class="loading">Loading...</div></div>
    <div class="tab-content" id="rfqs"><div class="loading">Loading...</div></div>
    <div class="tab-content" id="offers"><div class="loading">Loading...</div></div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.ready();
        tg.BackButton.show();
        tg.BackButton.onClick(() => { window.location.href = '/miniapps/index'; });

        let currentTab = 'registrations';
        let isAdmin = true; // Allow all users to access for testing
        let allUsers = [];
        let allRegistrations = [];
        let allRFQs = [];
        let allOffers = [];

        async function checkAdmin() {
            // Skip restrictive role check for now to allow all users access
            // The backend APIs will handle authorization
            return true;
        }

        async function loadStats() {
            try {
                const userId = tg.initDataUnsafe.user?.id;
                if (!userId) {
                    console.error('No Telegram user ID available');
                    return;
                }
                const response = await fetch('/admin/analytics/summary', {
                    headers: { 'X-Telegram-User-Id': String(userId) }
                });
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${await response.text()}`);
                }
                const stats = await response.json();
                document.getElementById('statsGrid').innerHTML = `
                    <div class="stat-card"><div class="stat-value">${stats.pending_registrations || 0}</div><div class="stat-label">Pending</div></div>
                    <div class="stat-card"><div class="stat-value">${stats.total_users || 0}</div><div class="stat-label">Users</div></div>
                    <div class="stat-card"><div class="stat-value">${stats.active_rfqs || 0}</div><div class="stat-label">RFQs</div></div>
                    <div class="stat-card"><div class="stat-value">${stats.total_offers || 0}</div><div class="stat-label">Offers</div></div>
                `;
                
            } catch (error) {
                console.error('Error loading stats:', error);
            }
        }

        async function loadRegistrations() {
            try {
                const userId = tg.initDataUnsafe.user?.id;
                if (!userId) {
                    throw new Error('No Telegram user ID');
                }
                const response = await fetch('/admin/registrations', {
                    headers: { 'X-Telegram-User-Id': String(userId) }
                });
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${await response.text()}`);
                }
                const data = await response.json();
                const registrations = data.registrations || [];
                const html = registrations.length === 0 ? '<div class="empty-state">No pending registrations</div>' : `
                    <div class="table-container"><table>
                        <thead><tr><th>Name</th><th>Phone</th><th>Role</th><th>Actions</th></tr></thead>
                        <tbody>${registrations.map(r => `
                            <tr>
                                <td><div class="user-name">${r.full_name || 'N/A'}</div></td>
                                <td>${r.phone_number || 'N/A'}</td>
                                <td><span class="role-badge ${r.role?.toLowerCase()}">${r.role || 'FARMER'}</span></td>
                                <td><div class="actions">
                                    <button class="btn-action btn-approve" onclick="approveUser(${r.id})"><svg><use href="#icon-check"/></svg>Approve</button>
                                    <button class="btn-action btn-reject" onclick="rejectUser(${r.id})"><svg><use href="#icon-x"/></svg>Reject</button>
                                </div></td>
                            </tr>
                        `).join('')}</tbody>
                    </table></div>
                `;
                document.getElementById('registrations').innerHTML = html;
            } catch (error) {
                document.getElementById('registrations').innerHTML = '<div class="empty-state">Error loading registrations</div>';
            }
        }

        async function loadUsers() {
            try {
                const userId = tg.initDataUnsafe.user?.id;
                if (!userId) {
                    throw new Error('No Telegram user ID');
                }
                const response = await fetch('/admin/users', {
                    headers: { 'X-Telegram-User-Id': String(userId) }
                });
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }
                const data = await response.json();
                allUsers = data.users || []; // Store for context
                const html = `<div class="table-container"><table>
                    <thead><tr><th>Name</th><th>Role</th><th>Status</th><th>Batches</th></tr></thead>
                    <tbody>${allUsers.map(u => `
                        <tr>
                            <td><div class="user-name">${u.name || 'N/A'}</div></td>
                            <td><span class="role-badge ${u.role?.toLowerCase()}">${u.role || 'FARMER'}</span></td>
                            <td><span class="status-badge ${u.is_approved ? 'approved' : 'pending'}">${u.is_approved ? 'Active' : 'Pending'}</span></td>
                            <td>${u.batch_count || 0}</td>
                        </tr>
                    `).join('')}</tbody>
                </table></div>`;
                document.getElementById('users').innerHTML = html;
            } catch (error) {
                document.getElementById('users').innerHTML = '<div class="empty-state">Error loading users</div>';
            }
        }

        async function loadRFQs() {
            try {
                const response = await fetch('/admin/rfqs', {
                    headers: { 'X-Telegram-User-Id': tg.initDataUnsafe.user?.id || 0 }
                });
                const rfqs = await response.json();
                const html = `<div class="table-container"><table>
                    <thead><tr><th>Title</th><th>Quantity</th><th>Coffee Type</th><th>Status</th><th>Offers</th></tr></thead>
                    <tbody>${rfqs.map(r => `
                        <tr>
                            <td><div class="user-name">${r.title || 'Coffee RFQ'}</div></td>
                            <td>${r.quantity_kg} kg</td>
                            <td>${r.coffee_type || 'Arabica'}</td>
                            <td><span class="status-badge ${r.status}">${r.status?.toUpperCase() || 'OPEN'}</span></td>
                            <td>${r.offer_count || 0}</td>
                        </tr>
                    `).join('')}</tbody>
                </table></div>`;
                document.getElementById('rfqs').innerHTML = html;
            } catch (error) {
                document.getElementById('rfqs').innerHTML = '<div class="empty-state">Error loading RFQs</div>';
            }
        }

        async function loadOffers() {
            try {
                const response = await fetch('/admin/offers', {
                    headers: { 'X-Telegram-User-Id': tg.initDataUnsafe.user?.id || 0 }
                });
                const data = await response.json();
                const offers = data.offers || [];
                const html = `<div class="table-container"><table>
                    <thead><tr><th>RFQ</th><th>Cooperative</th><th>Quantity</th><th>Price/kg</th><th>Status</th></tr></thead>
                    <tbody>${offers.map(o => `
                        <tr>
                            <td><div class="user-name">${o.rfq_title || 'N/A'}</div></td>
                            <td>${o.cooperative_name || 'N/A'}</td>
                            <td>${o.quantity_kg} kg</td>
                            <td>$${o.price_per_kg}</td>
                            <td><span class="status-badge ${o.status?.toLowerCase()}">${o.status || 'PENDING'}</span></td>
                        </tr>
                    `).join('')}</tbody>
                </table></div>`;
                document.getElementById('offers').innerHTML = html;
            } catch (error) {
                document.getElementById('offers').innerHTML = '<div class="empty-state">Error loading offers</div>';
            }
        }

        async function approveUser(userId) {
            try {
                await fetch(`/admin/registrations/${userId}/approve`, {
                    method: 'POST',
                    headers: { 'X-Telegram-User-Id': tg.initDataUnsafe.user?.id || 0 }
                });
                tg.showPopup({ title: 'Success', message: 'User approved', buttons: [{ type: 'ok' }] });
                loadRegistrations();
                loadStats();
            } catch (error) {
                tg.showAlert('Failed to approve user');
            }
        }

        async function rejectUser(userId) {
            try {
                await fetch(`/admin/registrations/${userId}/reject`, {
                    method: 'POST',
                    headers: { 'X-Telegram-User-Id': tg.initDataUnsafe.user?.id || 0 }
                });
                tg.showPopup({ title: 'Success', message: 'User rejected', buttons: [{ type: 'ok' }] });
                loadRegistrations();
                loadStats();
            } catch (error) {
                tg.showAlert('Failed to reject user');
            }
        }

        document.querySelectorAll('.tab').forEach(tab => {
            tab.addEventListener('click', () => {
                document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
                tab.classList.add('active');
                currentTab = tab.dataset.tab;
                document.getElementById(currentTab).classList.add('active');
                
                if (currentTab === 'registrations' && document.getElementById('registrations').innerHTML.includes('Loading')) loadRegistrations();
                if (currentTab === 'users' && document.getElementById('users').innerHTML.includes('Loading')) loadUsers();
                if (currentTab === 'rfqs' && document.getElementById('rfqs').innerHTML.includes('Loading')) loadRFQs();
                if (currentTab === 'offers' && document.getElementById('offers').innerHTML.includes('Loading')) loadOffers();
                
                tg.HapticFeedback.impactOccurred('light');
            });
        });

        document.getElementById('refreshBtn').addEventListener('click', () => {
            loadStats();
            if (currentTab === 'registrations') loadRegistrations();
            if (currentTab === 'users') loadUsers();
            if (currentTab === 'rfqs') loadRFQs();
            if (currentTab === 'offers') loadOffers();
            tg.HapticFeedback.impactOccurred('medium');
        });

        checkAdmin().then(() => { loadStats(); loadRegistrations(); });
    </script>

    <nav class="tab-bar">
        <a href="/miniapps/index.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>Home</a>
        <a href="/miniapps/batch_browser.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg>Batches</a>
        <a href="/miniapps/assistant.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>Assistant</a>
        <a href="/miniapps/marketplace.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>Market</a>
        <a href="/miniapps/profile.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>Profile</a>
    </nav>
</body>
</html>
