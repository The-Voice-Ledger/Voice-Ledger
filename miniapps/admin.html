<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Voice Ledger &ndash; Admin</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="/miniapps/shared/theme.css">
  <style>
    body{padding:0 0 80px;background:var(--bg)}
    .page-header{padding:20px 16px 14px;background:white;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
    .page-header h1{font-size:20px;font-weight:700;color:var(--stone-800)}
    .stats-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:16px}
    .stat-card{background:white;border:1px solid var(--border);border-radius:var(--r-lg);padding:16px;text-align:center}
    .stat-val{font-size:26px;font-weight:700;color:var(--stone-800)}
    .stat-lbl{font-size:11px;color:var(--stone-400);text-transform:uppercase;letter-spacing:.04em;margin-top:2px}
    .seg-tabs{display:flex;gap:4px;padding:0 16px 12px}
    .seg-tab{flex:1;padding:8px;border-radius:var(--r-md);border:1px solid var(--border);background:white;text-align:center;font-size:12px;font-weight:600;color:var(--stone-500);cursor:pointer;transition:all .15s}
    .seg-tab.active{background:var(--stone-800);color:white;border-color:var(--stone-800)}
    .admin-table{padding:0 16px}
    .table-row{display:flex;align-items:center;gap:10px;padding:12px 14px;background:white;border:1px solid var(--border);border-radius:var(--r-md);margin-bottom:8px}
    .table-avatar{width:34px;height:34px;border-radius:50%;flex-shrink:0;background:var(--stone-200);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;color:var(--stone-600)}
    .table-info{flex:1;min-width:0}
    .table-name{font-size:13px;font-weight:600;color:var(--stone-800);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .table-sub{font-size:11px;color:var(--stone-400)}
    .table-badge{padding:3px 8px;border-radius:99px;font-size:10px;font-weight:600;flex-shrink:0}
    .badge-approved{background:#dcfce7;color:#166534}
    .badge-pending{background:#fef3c7;color:#92400e}
    .badge-farmer{background:var(--stone-100);color:var(--stone-600)}
    .badge-cooperative{background:#dbeafe;color:#1e40af}
    .badge-exporter{background:#fef3c7;color:#92400e}
    .action-btn{padding:6px 12px;border-radius:var(--r-md);border:1px solid var(--border);background:white;font-size:11px;font-weight:600;color:var(--stone-600);cursor:pointer;flex-shrink:0}
    .action-btn.approve{background:#dcfce7;color:#166534;border-color:#bbf7d0}
    .action-btn:active{opacity:.8}
    .empty-state{text-align:center;padding:48px 16px;color:var(--stone-400);font-size:14px}
    .loading-state{text-align:center;padding:48px;color:var(--stone-400)}
  </style>
</head>
<body>
  <div class="page-header">
    <h1 data-i18n="admin_title">Admin Panel</h1>
    <div class="vl-lang-toggle"><button data-lang="en">EN</button><button data-lang="am">&#4771;&#4635;</button></div>
  </div>
  <div class="stats-grid" id="statsGrid">
    <div class="stat-card"><div class="stat-val" id="statUsers">&mdash;</div><div class="stat-lbl" data-i18n="admin_users">Users</div></div>
    <div class="stat-card"><div class="stat-val" id="statBatches">&mdash;</div><div class="stat-lbl">Batches</div></div>
    <div class="stat-card"><div class="stat-val" id="statRfqs">&mdash;</div><div class="stat-lbl" data-i18n="admin_rfqs">RFQs</div></div>
    <div class="stat-card"><div class="stat-val" id="statEvents">&mdash;</div><div class="stat-lbl">Events</div></div>
  </div>
  <div class="seg-tabs">
    <div class="seg-tab active" data-tab="users" data-i18n="admin_users">Users</div>
    <div class="seg-tab" data-tab="batches">Batches</div>
    <div class="seg-tab" data-tab="pending" data-i18n="admin_pending">Pending</div>
  </div>
  <div class="admin-table" id="adminTable"><div class="loading-state" data-i18n="loading">Loading...</div></div>

  <script src="/miniapps/shared/i18n.js"></script>
  <script src="/miniapps/shared/tab-bar.js"></script>
  <script>
    const tg = window.Telegram.WebApp;
    tg.expand(); tg.ready();
    tg.BackButton.show();
    tg.BackButton.onClick(() => { window.location.href = '/miniapps/index.html'; });
    const user = tg.initDataUnsafe.user;
    if (user && user.language_code === 'am' && !localStorage.getItem('vl_lang')) vlI18n.setLang('am');

    let allUsers = [];
    let allBatches = [];
    let activeTab = 'users';

    document.querySelectorAll('.seg-tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.seg-tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        activeTab = tab.dataset.tab;
        renderTable();
      });
    });

    async function loadAdmin() {
      try {
        const headers = { 'X-Telegram-User-Id': user?.id || 0 };
        const [usersRes, batchesRes, statsRes] = await Promise.all([
          fetch('/api/admin/users', { headers }).catch(() => ({ ok: false })),
          fetch('/api/miniapp/batches?user_id=' + (user?.id || 0), { headers }).catch(() => ({ ok: false })),
          fetch('/api/admin/stats', { headers }).catch(() => ({ ok: false })),
        ]);
        if (usersRes.ok) { const d = await usersRes.json(); allUsers = d.users || d || []; }
        if (batchesRes.ok) { const d = await batchesRes.json(); allBatches = d.batches || d || []; }
        if (statsRes.ok) {
          const s = await statsRes.json();
          document.getElementById('statUsers').textContent = s.total_users || allUsers.length || 0;
          document.getElementById('statBatches').textContent = s.total_batches || allBatches.length || 0;
          document.getElementById('statRfqs').textContent = s.total_rfqs || 0;
          document.getElementById('statEvents').textContent = s.total_events || 0;
        } else {
          document.getElementById('statUsers').textContent = allUsers.length;
          document.getElementById('statBatches').textContent = allBatches.length;
        }
        renderTable();
      } catch (e) {
        console.error(e);
        document.getElementById('adminTable').innerHTML = '<div class="empty-state">' + vlI18n.t('error') + '</div>';
      }
    }

    function getInitials(name) {
      if (!name) return '?';
      const parts = name.trim().split(' ');
      if (parts.length >= 2) return (parts[0][0] + parts[1][0]).toUpperCase();
      return name.substring(0, 2).toUpperCase();
    }

    function renderTable() {
      const el = document.getElementById('adminTable');
      if (activeTab === 'users') {
        if (!allUsers.length) { el.innerHTML = '<div class="empty-state">No users found</div>'; return; }
        el.innerHTML = allUsers.map(u => {
          const name = u.name||u.full_name||('User '+u.telegram_user_id);
          const role = (u.role||'FARMER').toLowerCase();
          return '<div class="table-row"><div class="table-avatar">' + getInitials(name) + '</div>' +
            '<div class="table-info"><div class="table-name">' + name + '</div><div class="table-sub">ID: ' + (u.telegram_user_id||'') + '</div></div>' +
            '<span class="table-badge badge-' + role + '">' + (u.role||'FARMER') + '</span>' +
            '<span class="table-badge ' + (u.is_approved ? 'badge-approved' : 'badge-pending') + '">' + (u.is_approved ? '&#10003;' : '&hellip;') + '</span></div>';
        }).join('');
      } else if (activeTab === 'batches') {
        if (!allBatches.length) { el.innerHTML = '<div class="empty-state">No batches found</div>'; return; }
        el.innerHTML = allBatches.map(b => {
          const st = (b.display_status||b.status||'').toLowerCase();
          return '<div class="table-row"><div class="table-info"><div class="table-name">' + (b.batch_id||b.id||'') + '</div>' +
            '<div class="table-sub">' + (b.origin||b.producer||'') + '</div></div>' +
            '<span class="table-badge badge-farmer">' + (b.display_status||b.status||'') + '</span></div>';
        }).join('');
      } else if (activeTab === 'pending') {
        const pending = allUsers.filter(u => !u.is_approved);
        if (!pending.length) { el.innerHTML = '<div class="empty-state">' + vlI18n.t('admin_no_pending') + '</div>'; return; }
        el.innerHTML = pending.map(u => {
          const name = u.name||u.full_name||('User '+u.telegram_user_id);
          return '<div class="table-row"><div class="table-avatar">' + getInitials(name) + '</div>' +
            '<div class="table-info"><div class="table-name">' + name + '</div><div class="table-sub">' + (u.role||'FARMER') + '</div></div>' +
            '<button class="action-btn approve" onclick="approveUser(' + u.telegram_user_id + ')">Approve</button></div>';
        }).join('');
      }
    }

    async function approveUser(telegramUserId) {
      try {
        const res = await fetch('/api/admin/approve', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'X-Telegram-User-Id': user?.id || 0 },
          body: JSON.stringify({ telegram_user_id: telegramUserId }),
        });
        if (!res.ok) throw new Error('Server ' + res.status);
        tg.showAlert('User approved');
        loadAdmin();
      } catch (e) { console.error(e); tg.showAlert('Failed to approve user'); }
    }

    vlTabBar('home');
    loadAdmin();
  </script>
</body>
</html>
