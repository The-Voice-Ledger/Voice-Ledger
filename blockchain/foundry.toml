[profile.default]
src = "src"
out = "out"
libs = ["lib"]
via_ir = true
optimizer = true
optimizer_runs = 200
evm_version = "cancun"

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options

[rpc_endpoints]
0g_testnet = "${OG_GALLILEO_TESTNET_RPC_URL}"
0g_mainnet = "${OG_GALLILEO_MAINNET_RPC_URL}"
base_sepolia = "${BASE_SEPOLIA_RPC_URL}"

[etherscan]
0g_testnet = { key = "${ZG_CHAINSCAN_API_KEY}", url = "https://chainscan-galileo.0g.ai/open/api", chain = 16602 }
0g_mainnet = { key = "${ZG_CHAINSCAN_API_KEY}", url = "https://chainscan.0g.ai/open/api", chain = 16661 }
base_sepolia = { key = "${ETHERSCAN_API_KEY}", url = "https://api.etherscan.io/v2/api?chainid=84532", chain = 84532 }
