<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Voice Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
        }
        
        #mic-button {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            border: none;
            color: white;
            font-size: 48px;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(79, 172, 254, 0.4);
            transition: all 0.3s;
        }
        
        #mic-button:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 30px rgba(79, 172, 254, 0.6);
        }
        
        #mic-button.recording {
            background: linear-gradient(135deg, #ff6b6b, #ee5a6f);
            animation: pulse 1.5s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        
        #output {
            margin-top: 30px;
            padding: 20px;
            background: #f5f5f5;
            border-radius: 8px;
            min-height: 100px;
        }
        
        .log {
            margin: 5px 0;
            padding: 8px;
            background: white;
            border-radius: 4px;
            font-family: monospace;
            font-size: 12px;
        }
        
        .success { border-left: 4px solid #4caf50; }
        .error { border-left: 4px solid #f44336; }
        .info { border-left: 4px solid #2196f3; }
    </style>
</head>
<body>
    <h1>🎙️ Simple Voice Test</h1>
    
    <div style="text-align: center; margin: 40px 0;">
        <button id="mic-button">🎤</button>
    </div>
    
    <div id="output"></div>

    <script>
        const output = document.getElementById('output');
        const micButton = document.getElementById('mic-button');
        
        let mediaRecorder = null;
        let audioChunks = [];
        let isRecording = false;
        
        function log(message, type = 'info') {
            const div = document.createElement('div');
            div.className = `log ${type}`;
            div.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            output.appendChild(div);
            output.scrollTop = output.scrollHeight;
            console.log(message);
        }
        
        log('✅ Page loaded', 'success');
        log('🌐 Browser: ' + navigator.userAgent.split(' ').pop(), 'info');
        log('✅ Mic button found: ' + (micButton ? 'YES' : 'NO'), micButton ? 'success' : 'error');
        
        // Check browser capabilities
        if (!navigator.mediaDevices) {
            log('❌ navigator.mediaDevices not available', 'error');
            log('💡 Try using Chrome or enable microphone in browser settings', 'info');
        } else {
            log('✅ navigator.mediaDevices available', 'success');
        }
        
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
            log('❌ getUserMedia not supported', 'error');
            log('💡 Safari Issue: Try Chrome/Firefox or check System Preferences > Security & Privacy > Microphone', 'info');
        } else {
            log('✅ getUserMedia available', 'success');
        }
        
        if (!micButton) {
            log('❌ CRITICAL: Mic button not found!', 'error');
        }
        
        async function startRecording() {
            try {
                log('🎤 Requesting microphone access...', 'info');
                
                // Check if getUserMedia exists
                if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                    throw new Error('getUserMedia not supported in this browser. Please use Chrome, Firefox, or Edge.');
                }
                
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                log('✅ Microphone access granted', 'success');
                
                mediaRecorder = new MediaRecorder(stream);
                audioChunks = [];
                
                mediaRecorder.ondataavailable = (event) => {
                    if (event.data.size > 0) {
                        audioChunks.push(event.data);
                        log(`📦 Audio chunk: ${event.data.size} bytes`, 'info');
                    }
                };
                
                mediaRecorder.onstop = async () => {
                    log('⏹️ Recording stopped', 'info');
                    
                    const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                    log(`📊 Total audio size: ${audioBlob.size} bytes`, 'success');
                    
                    // Upload to backend
                    await uploadAudio(audioBlob);
                    
                    micButton.classList.remove('recording');
                    stream.getTracks().forEach(track => track.stop());
                };
                
                mediaRecorder.start();
                isRecording = true;
                micButton.classList.add('recording');
                log('🔴 Recording started!', 'success');
                
            } catch (error) {
                log('❌ Error: ' + error.message, 'error');
                console.error(error);
                isRecording = false;
                micButton.classList.remove('recording');
            }
        }
        
        function stopRecording() {
            if (mediaRecorder && mediaRecorder.state === 'recording') {
                mediaRecorder.stop();
                isRecording = false;
                log('⏸️ Stopping recording...', 'info');
            }
        }
        
        async function uploadAudio(audioBlob) {
            try {
                log('📤 Uploading audio...', 'info');
                
                const formData = new FormData();
                formData.append('audio', audioBlob, 'recording.webm');
                formData.append('language', 'en');
                
                const response = await fetch('/api/voice/upload', {
                    method: 'POST',
                    body: formData
                });
                
                if (!response.ok) {
                    throw new Error(`Upload failed: ${response.status}`);
                }
                
                const data = await response.json();
                log('✅ Upload successful', 'success');
                log('📝 Transcript: ' + (data.transcript || 'N/A'), 'info');
                log('💬 Response: ' + (data.message_text || data.message || 'N/A'), 'success');
                
                // Play TTS if available
                if (data.tts_file) {
                    log('🔊 Playing TTS audio...', 'info');
                    const audio = new Audio('/api/voice/tts/' + data.tts_file);
                    audio.play();
                }
                
            } catch (error) {
                log('❌ Upload error: ' + error.message, 'error');
                console.error(error);
            }
        }
        
        // Attach click handler
        micButton.addEventListener('click', () => {
            log('🖱️ Button clicked!', 'info');
            
            if (isRecording) {
                stopRecording();
            } else {
                startRecording();
            }
        });
        
        log('✅ Click handler attached', 'success');
        log('👆 Click the microphone button to test!', 'info');
    </script>
</body>
</html>
