name: Tests

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-asyncio

      - name: Run unit tests
        env:
          DATABASE_URL: "sqlite:///:memory:"
          OPENAI_API_KEY: "test-key"
          TELEGRAM_BOT_TOKEN: "test-token"
          JWT_SECRET_KEY: "test-secret-for-ci-only"
          REDIS_URL: "redis://localhost:6379/15"
          SQL_ECHO: "false"
          APP_SECRET_KEY: "test-app-secret-for-ci-only"
        run: |
          pytest \
            -m "not slow and not integration and not e2e" \
            --ignore=tests/test_location_share.py \
            --ignore=tests/test_lsp_customs_integration.py \
            --ignore=tests/test_pin_setup.py \
            --ignore=tests/test_telegram_verification.py \
            --ignore=tests/test_voice_api.py \
            --ignore=tests/test_aggregated_dpp.py \
            --ignore=tests/test_aggregation_nlu.py \
            --ignore=tests/test_anchor_flow.py \
            --ignore=tests/test_batch_split.py \
            --ignore=tests/test_commission_events.py \
            --ignore=tests/test_conversational_ai.py \
            --ignore=tests/test_cre_bridge.py \
            --ignore=tests/test_db.py \
            --ignore=tests/test_defi_agent_tools.py \
            --ignore=tests/test_dpp.py \
            --ignore=tests/test_dpp_flow.py \
            --ignore=tests/test_e2e_commission_verification.py \
            --ignore=tests/test_ipfs_blockchain_integration.py \
            --ignore=tests/test_livekit_provider_fallback.py \
            --ignore=tests/test_registration_verification_e2e.py \
            --ignore=tests/test_validators.py \
            --ignore=tests/test_agent.py \
            --ignore=tests/test_qr_storage.py \
            --ignore=tests/test_telegram_commands.py \
            --ignore=tests/test_telegram_rfq.py \
            --ignore=tests/test_gps_photo_verifier.py \
            --tb=short -q --no-header
