name: Tests

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-asyncio

      - name: Run unit tests
        env:
          DATABASE_URL: "sqlite:///:memory:"
          OPENAI_API_KEY: "test-key"
          TELEGRAM_BOT_TOKEN: "test-token"
          JWT_SECRET_KEY: "test-secret-for-ci-only"
          REDIS_URL: "redis://localhost:6379/15"
          SQL_ECHO: "false"
        run: |
          pytest \
            -m "not slow and not integration and not e2e" \
            --ignore=tests/test_location_share.py \
            --ignore=tests/test_lsp_customs_integration.py \
            --ignore=tests/test_pin_setup.py \
            --ignore=tests/test_telegram_verification.py \
            --ignore=tests/test_voice_api.py \
            --tb=short -q --no-header
